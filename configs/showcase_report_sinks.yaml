# SHOWCASE: report persistence as explicit DAG nodes (architecture §8 — results
# ownership). The aggregate computes the report; terminal sink nodes persist it:
# leaderboard_sink ingests the run into leaderboard.sqlite (queryable via
# /api/leaderboard and the UI results page) and writes report_<name>.json next to the
# results; dataset_sink exports the synthesized query audio + any generated answers as
# a reusable prepared dataset. I/O stays an explicit, opt-in part of the graph.
experiment:
  name: showcase_report_sinks
  output_dir: evaluation_results/showcase
dataset:
  id: pubmed_qa
  questions: examples/data/pubmed_qa_small/questions.json
  corpus: examples/data/pubmed_qa_small/corpus.json
  trace_limit: 5
  batch_size: 4
data:
  num_workers: 0
graph:
  nodes:
  - dataset_source
  - corpus_embedding
  - vector_db
  - id: tts
    type: tts
    params:
      provider: mms
      voice: en
      sample_rate: 16000
      seed: 42
      output_dir: evaluation_results/showcase/audio
  - asr
  - text_embedding
  - retrieval
  - metrics
  - finalize
  - aggregate
  - leaderboard_sink
  - id: dataset_sink
    type: dataset_sink
    params:
      output_dir: evaluation_results/showcase/exported_dataset
  edges:
  - {from: dataset_source, to: corpus_embedding, input: corpus}
  - {from: corpus_embedding, to: vector_db, input: corpus_vectors}
  - {from: dataset_source, to: tts, input: query_text}
  - {from: dataset_source, to: asr, input: query_audio}
  - {from: tts, to: asr, input: query_audio}
  - {from: dataset_source, to: asr, input: reference_transcription}
  - {from: dataset_source, to: text_embedding, input: query_text}
  - {from: asr, to: text_embedding, input: query_text}
  - {from: text_embedding, output: text_query_vectors, to: retrieval, input: query_vectors}
  - {from: vector_db, to: retrieval, input: vector_index}
  - {from: dataset_source, to: retrieval, input: query_text}
  - {from: asr, to: retrieval, input: query_text}
  - {from: dataset_source, to: retrieval, input: reference_transcription}
  - {from: dataset_source, to: retrieval, input: relevant_docs}
  - {from: retrieval, to: metrics, input: retrieved}
  - {from: dataset_source, to: metrics, input: query_text}
  - {from: asr, to: metrics, input: query_text}
  - {from: dataset_source, to: metrics, input: reference_transcription}
  - {from: dataset_source, to: metrics, input: relevant_docs}
  - {from: metrics, to: finalize, input: metrics}
  - {from: retrieval, to: finalize, input: retrieved}
  - {from: retrieval, to: aggregate, input: retrieved}
  - {from: metrics, to: aggregate, input: metrics}
  - {from: dataset_source, to: aggregate, input: query_text}
  - {from: asr, to: aggregate, input: query_text}
  - {from: dataset_source, to: aggregate, input: relevant_docs}
  - {from: dataset_source, to: aggregate, input: reference_text}
  - {from: dataset_source, to: aggregate, input: reference_transcription}
  - {from: metrics, to: leaderboard_sink, input: metrics}
  - {from: dataset_source, to: dataset_sink, input: query_audio}
  - {from: tts, to: dataset_sink, input: query_audio}
nodes:
  asr:
    model: whisper
    size: base
    device: cuda:0
  text_embedding:
    model: labse
    device: cuda:0
  retrieval:
    k: 10
runtime:
  cache:
    enabled: true
  logging:
    console_level: WARNING
