# Two-hop RAG on spoken questions — TTS engine comparison on pubmed_qa_fulltext_big.
#
# One graph: dataset_source/corpus_embedding/vector_db are shared (each has multiple
# outgoing edges); four distinctly-named tts nodes diverge from there, each with its own
# asr/retrieval/query_refine/generation/judging chain. No graph.branches.
#
# Variants:
#   mms      — Meta MMS (facebook/mms-tts-eng), fast HF transformer
#   piper    — Piper (en_US-lessac-medium), fast local ONNX
#   xtts_v2  — Coqui XTTS-v2, multilingual neural (requires `pip install TTS`)
#   m4t      — SeamlessM4T-v2, multilingual HF transformer
#
# COST: 4 × full sweep (1209 questions each). Judge dominates (~26 s/case serial).
# Run: OLLAMA_NUM_PARALLEL=4 OLLAMA_CONTEXT_LENGTH=8192 ollama serve
experiment:
  name: pubmed_qa_fulltext_big_tts_cmp
  output_dir: evaluation_results

dataset:
  id: pubmed_qa
  questions: examples/data/pubmed_qa_fulltext_big/questions.json
  corpus: examples/data/pubmed_qa_fulltext_big/corpus.json
  trace_limit: 0
  batch_size: 8

data:
  num_workers: 0

query_optimization:
  enabled: true

nodes:
  asr:
    model: whisper
    size: large
    device: cuda:1
  text_embedding:
    model: jina_v4
    name: jinaai/jina-embeddings-v4
    device: cuda:2
  vector_db:
    store: inmemory

graph:
  nodes:
  - dataset_source
  - corpus_embedding
  - vector_db
  - id: tts_mms
    type: tts
    params:
      provider: mms
      voice: en
      sample_rate: 16000
      seed: 42
      output_dir: evaluation_results/pubmed_fulltext_big_tts_cmp/mms/audio
  - id: tts_piper
    type: tts
    params:
      provider: piper
      voice: en_US-lessac-medium
      sample_rate: 16000
      seed: 42
      output_dir: evaluation_results/pubmed_fulltext_big_tts_cmp/piper/audio
  - id: tts_xtts_v2
    type: tts
    params:
      provider: xtts_v2
      language: en
      sample_rate: 16000
      seed: 42
      output_dir: evaluation_results/pubmed_fulltext_big_tts_cmp/xtts_v2/audio
  - id: tts_m4t
    type: tts
    params:
      provider: m4t
      language: en
      sample_rate: 16000
      seed: 42
      output_dir: evaluation_results/pubmed_fulltext_big_tts_cmp/m4t/audio
  - id: asr_mms
    type: asr
  - id: asr_piper
    type: asr
  - id: asr_xtts_v2
    type: asr
  - id: asr_m4t
    type: asr
  - id: text_embedding_mms
    type: text_embedding
  - id: text_embedding_piper
    type: text_embedding
  - id: text_embedding_xtts_v2
    type: text_embedding
  - id: text_embedding_m4t
    type: text_embedding
  - id: retrieval_mms
    type: retrieval
    params: {k: 10}
  - id: retrieval_piper
    type: retrieval
    params: {k: 10}
  - id: retrieval_xtts_v2
    type: retrieval
    params: {k: 10}
  - id: retrieval_m4t
    type: retrieval
    params: {k: 10}
  - &query_refine_mms
    id: query_refine_mms
    type: query_refine
    params: &query_refine_params
      method: rewrite_with_context
      context_top_k: 3
  - id: query_refine_piper
    type: query_refine
    params: *query_refine_params
  - id: query_refine_xtts_v2
    type: query_refine
    params: *query_refine_params
  - id: query_refine_m4t
    type: query_refine
    params: *query_refine_params
  - id: text_embedding_refined_mms
    type: text_embedding
  - id: text_embedding_refined_piper
    type: text_embedding
  - id: text_embedding_refined_xtts_v2
    type: text_embedding
  - id: text_embedding_refined_m4t
    type: text_embedding
  - id: retrieval_refined_mms
    type: retrieval
  - id: retrieval_refined_piper
    type: retrieval
  - id: retrieval_refined_xtts_v2
    type: retrieval
  - id: retrieval_refined_m4t
    type: retrieval
  - &answer_gen_mms
    id: answer_gen_mms
    type: answer_gen
    params: &answer_gen_params
      method: simple
      max_cases: 0
      system_prompt: |-
        You are a concise medical research assistant. Answer based ONLY on the provided context. Be brief and direct.
        Reply in exactly this format, nothing before it:
        Short Answer: yes or no or maybe
        Long Answer: <your detailed answer>
      prompt_template: |-
        Context:
        {context}

        Question: {question}

        Short Answer:
      context_docs: 3
      compute_rouge: true
      reference_metadata_field: long_answer
      context_source: full_text
      context_chunk_chars: 1200
      context_chunks: 4
  - id: answer_gen_piper
    type: answer_gen
    params: *answer_gen_params
  - id: answer_gen_xtts_v2
    type: answer_gen
    params: *answer_gen_params
  - id: answer_gen_m4t
    type: answer_gen
    params: *answer_gen_params
  - id: transcription_metrics_mms
    type: transcription_metrics
  - id: transcription_metrics_piper
    type: transcription_metrics
  - id: transcription_metrics_xtts_v2
    type: transcription_metrics
  - id: transcription_metrics_m4t
    type: transcription_metrics
  - id: retrieval_metrics_mms
    type: retrieval_metrics
  - id: retrieval_metrics_piper
    type: retrieval_metrics
  - id: retrieval_metrics_xtts_v2
    type: retrieval_metrics
  - id: retrieval_metrics_m4t
    type: retrieval_metrics
  - id: answer_metrics_mms
    type: answer_metrics
  - id: answer_metrics_piper
    type: answer_metrics
  - id: answer_metrics_xtts_v2
    type: answer_metrics
  - id: answer_metrics_m4t
