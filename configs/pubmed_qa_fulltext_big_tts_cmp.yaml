# Two-hop RAG on spoken questions — TTS engine comparison on pubmed_qa_fulltext_big.
#
# Four branches, one per TTS provider; everything downstream (ASR, retrieval, generation,
# judging) runs per-branch. corpus_embedding + vector_db run once via CSE.
#
# Branches:
#   mms      — Meta MMS (facebook/mms-tts-eng), fast HF transformer
#   piper    — Piper (en_US-lessac-medium), fast local ONNX
#   xtts_v2  — Coqui XTTS-v2, multilingual neural (requires `pip install TTS`)
#   m4t      — SeamlessM4T-v2, multilingual HF transformer
#
# COST: 4 × full sweep (1209 questions each). Judge dominates (~26 s/case serial).
# Run: OLLAMA_NUM_PARALLEL=4 OLLAMA_CONTEXT_LENGTH=8192 ollama serve
experiment:
  name: pubmed_qa_fulltext_big_tts_cmp
  output_dir: evaluation_results

dataset:
  id: pubmed_qa
  questions: examples/data/pubmed_qa_fulltext_big/questions.json
  corpus: examples/data/pubmed_qa_fulltext_big/corpus.json
  trace_limit: 0
  batch_size: 8

data:
  num_workers: 0

graph:
  branches:
  - id: mms
    tts:
      provider: mms
      voice: en
      sample_rate: 16000
      seed: 42
      output_dir: evaluation_results/pubmed_fulltext_big_tts_cmp/mms/audio
  - id: piper
    tts:
      provider: piper
      voice: en_US-lessac-medium
      sample_rate: 16000
      seed: 42
      output_dir: evaluation_results/pubmed_fulltext_big_tts_cmp/piper/audio
  - id: xtts_v2
    tts:
      provider: xtts_v2
      language: en
      sample_rate: 16000
      seed: 42
      output_dir: evaluation_results/pubmed_fulltext_big_tts_cmp/xtts_v2/audio
  - id: m4t
    tts:
      provider: m4t
      language: en
      sample_rate: 16000
      seed: 42
      output_dir: evaluation_results/pubmed_fulltext_big_tts_cmp/m4t/audio
  nodes:
  - dataset_source
  - tts
  - corpus_embedding
  - vector_db
  - asr
  - text_embedding
  - retrieval
  - id: query_refine
    type: query_refine
    params:
      method: rewrite_with_context
      context_top_k: 3
  - id: text_embedding_refined
    type: text_embedding
  - id: retrieval_refined
    type: retrieval
  - id: answer_gen
    type: answer_gen
    params:
      method: simple
      max_cases: 0
      system_prompt: |-
        You are a concise medical research assistant. Answer based ONLY on the provided context. Be brief and direct.
        Reply in exactly this format, nothing before it:
        Short Answer: yes or no or maybe
        Long Answer: <your detailed answer>
      prompt_template: |-
        Context:
        {context}

        Question: {question}

        Short Answer:
      context_docs: 3
      compute_rouge: true
      reference_metadata_field: long_answer
      context_source: full_text
      context_chunk_chars: 1200
      context_chunks: 4
  - transcription_metrics
  - retrieval_metrics
  - answer_metrics
  - metrics
  - build_query_traces
  - id: answer_judge
    type: answer_judge
    params:
      max_cases: 0
      system_prompt: |-
        You are an expert evaluator for a medical question-answering retrieval system. Score each requested aspect from 0.0 (worst) to 1.0 (best). Be strict and consistent. Respond with STRICT JSON only — no prose, no markdown.
  - finalize
  edges:
  - {from: dataset_source, to: corpus_embedding, input: corpus}
  - {from: corpus_embedding, to: vector_db, input: corpus_vectors}
  - {from: dataset_source, to: tts, input: query_text}
  - {from: dataset_source, to: asr, input: query_audio}
  - {from: tts, to: asr, input: query_audio}
  - {from: dataset_source, to: asr, input: reference_transcription}
  - {from: asr, to: text_embedding, input: query_text}
  - {from: text_embedding, output: text_query_vectors, to: retrieval, input: query_vectors}
  - {from: vector_db, to: retrieval, input: vector_index}
  - {from: asr, to: retrieval, input: query_text}
  - {from: dataset_source, to: retrieval, input: reference_transcription}
  - {from: dataset_source, to: retrieval, input: relevant_docs}
  - {from: asr, to: query_refine, input: query_text}
  - {from: retrieval, to: query_refine, input: retrieved}
  - {from: query_refine, output: refined_query_text, to: text_embedding_refined, input: query_text}
  - {from: text_embedding_refined, output: text_query_vectors, to: retrieval_refined, input: query_vectors}
  - {from: vector_db, to: retrieval_refined, input: vector_index}
  - {from: query_refine, output: refined_query_text, to: retrieval_refined, input: query_text}
  - {from: dataset_source, to: retrieval_refined, input: reference_transcription}
  - {from: dataset_source, to: retrieval_refined, input: relevant_docs}
  - {from: asr, to: answer_gen, input: query_text}
  - {from: retrieval_refined, to: answer_gen, input: retrieved}
  - {from: dataset_source, to: answer_gen, input: short_answers}
  - {from: dataset_source, to: answer_gen, input: relevant_docs}
  - {from: asr, to: transcription_metrics, input: query_text}
  - {from: dataset_source, to: transcription_metrics, input: reference_transcription}
  - {from: retrieval_refined, to: retrieval_metrics, input: retrieved}
  - {from: dataset_source, to: retrieval_metrics, input: relevant_docs}
  - {from: answer_gen, to: answer_metrics, input: generated_answers}
  - {from: retrieval_refined, to: answer_metrics, input: retrieved}
  - {from: dataset_source, to: answer_metrics, input: relevant_docs}
  - {from: dataset_source, to: answer_metrics, input: short_answers}
  - {from: transcription_metrics, to: metrics, input: transcription_scores}
  - {from: retrieval_metrics, to: metrics, input: retrieval_scores}
  - {from: answer_metrics, to: metrics, input: answer_scores}
  - {from: retrieval_refined, to: metrics, input: retrieved}
  - {from: asr, to: metrics, input: query_text}
  - {from: dataset_source, to: metrics, input: reference_transcription}
  - {from: dataset_source, to: metrics, input: relevant_docs}
  - {from: transcription_metrics, to: metrics, input: per_query_wer}
  - {from: transcription_metrics, to: metrics, input: per_query_cer}
  - {from: retrieval_metrics, to: metrics, input: per_query_recall5}
  - {from: retrieval_refined, to: build_query_traces, input: retrieved}
  - {from: answer_gen, to: build_query_traces, input: generated_answers}
  - {from: metrics, to: build_query_traces, input: metrics}
  - {from: dataset_source, to: build_query_traces, input: reference_transcription}
  - {from: dataset_source, to: build_query_traces, input: relevant_docs}
  - {from: transcription_metrics, to: build_query_traces, input: per_query_wer}
  - {from: transcription_metrics, to: build_query_traces, input: per_query_cer}
  - {from: retrieval_metrics, to: build_query_traces, input: per_query_recall5}
  - {from: metrics, to: answer_judge, input: metrics}
  - {from: build_query_traces, to: answer_judge, input: query_traces}
  - {from: answer_gen, to: answer_judge, input: generated_answers}
  - {from: retrieval_refined, to: answer_judge, input: retrieved}
  - {from: dataset_source, to: answer_judge, input: relevant_docs}
  - {from: retrieval_metrics, to: answer_judge, input: per_query_recall5}
  - {from: metrics, to: finalize, input: metrics}
  - {from: build_query_traces, to: finalize, input: query_traces}
  - {from: answer_judge, to: finalize, input: judge_scores}
  - {from: answer_judge, to: finalize, input: judge_pass}
  - {from: answer_gen, to: finalize, input: generated_answers}
  - {from: retrieval_refined, to: finalize, input: retrieved}
  - {from: answer_judge, to: finalize, input: judge_aspect_accuracy}
  - {from: answer_judge, to: finalize, input: judge_aspect_clarity}
  - {from: answer_judge, to: finalize, input: judge_aspect_completeness}
  - {from: answer_judge, to: finalize, input: judge_aspect_correctness}
  - {from: answer_judge, to: finalize, input: judge_aspect_factuality}
  - {from: answer_judge, to: finalize, input: judge_aspect_faithfulness}
  - {from: answer_judge, to: finalize, input: judge_aspect_relevance}

nodes:
  asr:
    model: whisper
    size: large
    device: cuda:1
  text_embedding:
    model: jina_v4
    name: jinaai/jina-embeddings-v4
    device: cuda:2
  vector_db:
    store: inmemory
  retrieval:
    k: 10

query_optimization:
  enabled: true

llm:
  model: gemma4:latest
  use_local_server: true
  local_server_url: http://localhost:11434/v1/chat/completions
  api_key_env: DUMMY_KEY
  temperature: 0.0
  concurrency: 4
  seed: 42
  timeout_s: 600

runtime:
  cache:
    enabled: true
    cache_dir: .cache
    cache_asr_features: true
    cache_transcriptions: true
    cache_embeddings: true
    cache_vector_db: true
  logging:
    console_level: INFO
    file_level: DEBUG
