  - id: metrics_piper
    type: metrics
  - id: metrics_xtts_v2
    type: metrics
  - id: metrics_m4t
    type: metrics
  - id: build_query_traces_mms
    type: build_query_traces
  - id: build_query_traces_piper
    type: build_query_traces
  - id: build_query_traces_xtts_v2
    type: build_query_traces
  - id: build_query_traces_m4t
    type: build_query_traces
  - &answer_judge_mms
    id: answer_judge_mms
    type: answer_judge
    params: &answer_judge_params
      max_cases: 0
      system_prompt: |-
        You are an expert evaluator for a medical question-answering retrieval system. Score each requested aspect from 0.0 (worst) to 1.0 (best). Be strict and consistent. Respond with STRICT JSON only — no prose, no markdown.
  - id: answer_judge_piper
    type: answer_judge
    params: *answer_judge_params
  - id: answer_judge_xtts_v2
    type: answer_judge
    params: *answer_judge_params
  - id: answer_judge_m4t
    type: answer_judge
    params: *answer_judge_params
  - id: finalize_mms
    type: finalize
  - id: finalize_piper
    type: finalize
  - id: finalize_xtts_v2
    type: finalize
  - id: finalize_m4t
    type: finalize
