# APM self-retrieval — all 6 models on hani_medical (2 encoders × 3 pooling strategies).
# Shared prefix (corpus_embedding + vector_db) runs once via CSE; branches diverge at audio_embedding.
experiment:
  name: apm_hani_all_models
  output_dir: evaluation_results

dataset:
  id: hani_medical
  split: train
  batch_size: 32
  trace_limit: 300

data:
  num_workers: 4

graph:
  branches:
  - id: whisper_attention
    audio_embedding:
      model: attention_pool
      encoder: whisper
      encoder-size: large
      dim: 2048
      embedding_space: jina_v4_space
      params:
        pooling: attention
      model_path: ${APM_CHECKPOINT_DIR}/apm_whisper_jina_admed_voice.pt
      device: cuda:0
  - id: whisper_whiten
    audio_embedding:
      model: attention_pool
      encoder: whisper
      encoder-size: large
      dim: 2048
      embedding_space: jina_v4_space
      params:
        pooling: mean_whiten
      model_path: ${APM_CHECKPOINT_DIR}/apm_whisper_jina_admed_voice_whitened_none.pt
      device: cuda:0
  - id: whisper_abtt
    audio_embedding:
      model: attention_pool
      encoder: whisper
      encoder-size: large
      dim: 2048
      embedding_space: jina_v4_space
      params:
        pooling: mean_abtt
      model_path: ${APM_CHECKPOINT_DIR}/apm_whisper_jina_admed_voice_abtt_none.pt
      device: cuda:0
  - id: m4t_attention
    audio_embedding:
      model: attention_pool
      encoder: m4t
      encoder-size: v2-large
      dim: 2048
      embedding_space: jina_v4_space
      params:
        pooling: attention
      model_path: ${APM_CHECKPOINT_DIR}/apm_m4t_jina_admed_voice_attention_whitening.pt
      device: cuda:0
  - id: m4t_whiten
    audio_embedding:
      model: attention_pool
      encoder: m4t
      encoder-size: v2-large
      dim: 2048
      embedding_space: jina_v4_space
      params:
        pooling: mean_whiten
      model_path: ${APM_CHECKPOINT_DIR}/apm_m4t_jina_admed_voice_whitened_none.pt
      device: cuda:0
  - id: m4t_abtt
    audio_embedding:
      model: attention_pool
      encoder: m4t
      encoder-size: v2-large
      dim: 2048
      embedding_space: jina_v4_space
      params:
        pooling: mean_abtt
      model_path: ${APM_CHECKPOINT_DIR}/apm_m4t_jina_admed_voice_abtt_none.pt
      device: cuda:0
  nodes:
  - dataset_source
  - id: corpus_embedding
    type: corpus_embedding
    params:
      model: jina_v4
      name: jinaai/jina-embeddings-v4
      embedding_space: jina_v4_space
      device: cuda:1
  - vector_db
  - audio_embedding
  - retrieval
  - retrieval_metrics
  - metrics
  - build_query_traces
  - finalize
  edges:
  - {from: dataset_source, to: corpus_embedding, input: corpus}
  - {from: corpus_embedding, to: vector_db, input: corpus_vectors}
  - {from: dataset_source, to: audio_embedding, input: query_audio}
  - {from: audio_embedding, output: audio_query_vectors, to: retrieval, input: query_vectors}
  - {from: vector_db, to: retrieval, input: vector_index}
  - {from: dataset_source, to: retrieval, input: query_text}
  - {from: dataset_source, to: retrieval, input: reference_transcription}
  - {from: dataset_source, to: retrieval, input: relevant_docs}
  - {from: retrieval, to: retrieval_metrics, input: retrieved}
  - {from: dataset_source, to: retrieval_metrics, input: relevant_docs}
  - {from: retrieval_metrics, to: metrics, input: retrieval_scores}
  - {from: retrieval, to: metrics, input: retrieved}
  - {from: dataset_source, to: metrics, input: query_text}
  - {from: dataset_source, to: metrics, input: reference_transcription}
  - {from: dataset_source, to: metrics, input: relevant_docs}
  - {from: retrieval_metrics, to: metrics, input: per_query_recall5}
  - {from: retrieval, to: build_query_traces, input: retrieved}
  - {from: metrics, to: build_query_traces, input: metrics}
  - {from: dataset_source, to: build_query_traces, input: reference_transcription}
  - {from: dataset_source, to: build_query_traces, input: relevant_docs}
  - {from: retrieval_metrics, to: build_query_traces, input: per_query_recall5}
  - {from: metrics, to: finalize, input: metrics}
  - {from: build_query_traces, to: finalize, input: query_traces}
  - {from: retrieval, to: finalize, input: retrieved}

nodes:
  text_embedding:
    model: jina_v4
    name: jinaai/jina-embeddings-v4
    embedding_space: jina_v4_space
    device: cuda:1
  vector_db:
    store: inmemory
  retrieval:
    k: 10

runtime:
  cache:
    enabled: true
    cache_dir: .cache
    cache_asr_features: false
    cache_transcriptions: false
    cache_embeddings: true
    cache_vector_db: true
  logging:
    console_level: INFO
    file_level: DEBUG
