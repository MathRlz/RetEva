experiment:
  name: asr_robustness_test
  output_dir: evaluation_results/robustness
dataset:
  type: audio_transcription
  batch_size: 16
  trace_limit: 0
  language: en
data:
  audio_dir: test_audio/
  transcripts_file: test_audio/transcripts.json
graph:
  nodes:
  - dataset_source
  - asr
  - transcription_metrics
  - metrics
  - finalize
nodes:
  asr:
    model: whisper
    name: openai/whisper-medium
    device: cuda:0
runtime:
  cache:
    enabled: true
    cache_dir: .cache
  logging:
    log_dir: logs
    console_level: INFO
    file_level: DEBUG
