# Hani89 medical self-retrieval — v3: audio + text fusion.
# Same "fake" retrieval target (vector DB = the text transcriptions). The query is embedded
# BOTH ways — audio (attention_pool) and text (jina_v4, over the reference transcription) — and
# the two query vectors are fused (embedding_fusion) into one before searching the text corpus.
# embedding_fusion.enabled is what inserts the `fusion` node; without it audio_text_retrieval
# collapses to audio-only. SONAR alternative: audio_embedding.model: sonar_speech (size: eng)
# + text_embedding.model: sonar.
experiment:
  name: hani_selfretr_fusion
  output_dir: evaluation_results
dataset:
  id: hani_medical
  split: train
  batch_size: 32
  trace_limit: 300
data:
  num_workers: 4
graph:
  nodes:
  - dataset_source
  - corpus_embedding
  - vector_db
  - asr
  - audio_embedding
  - text_embedding
  - fusion
  - retrieval
  - embedding_alignment_metrics
  - retrieval_metrics
  - metrics
  - build_query_traces
  - finalize
  edges:
  - {from: dataset_source, to: corpus_embedding, input: corpus}
  - {from: corpus_embedding, to: vector_db, input: corpus_vectors}
  - {from: dataset_source, to: asr, input: query_audio}
  - {from: dataset_source, to: asr, input: reference_transcription}
  - {from: dataset_source, to: audio_embedding, input: query_audio}
  - {from: dataset_source, to: text_embedding, input: query_text}
  - {from: asr, to: text_embedding, input: query_text}
  - {from: audio_embedding, to: fusion, input: audio_query_vectors}
  - {from: text_embedding, to: fusion, input: text_query_vectors}
  - {from: fusion, output: fused_query_vectors, to: retrieval, input: query_vectors}
  - {from: audio_embedding, output: audio_query_vectors, to: retrieval, input: query_vectors}
  - {from: text_embedding, output: text_query_vectors, to: retrieval, input: query_vectors}
  - {from: vector_db, to: retrieval, input: vector_index}
  - {from: dataset_source, to: retrieval, input: query_text}
  - {from: asr, to: retrieval, input: query_text}
  - {from: dataset_source, to: retrieval, input: reference_transcription}
  - {from: dataset_source, to: retrieval, input: relevant_docs}
  - {from: audio_embedding, to: embedding_alignment_metrics, input: audio_query_vectors}
  - {from: text_embedding, to: embedding_alignment_metrics, input: text_query_vectors}
  - {from: retrieval, to: retrieval_metrics, input: retrieved}
  - {from: dataset_source, to: retrieval_metrics, input: relevant_docs}
  - {from: retrieval_metrics, to: metrics, input: retrieval_scores}
  - {from: retrieval, to: metrics, input: retrieved}
  - {from: dataset_source, to: metrics, input: query_text}
  - {from: asr, to: metrics, input: query_text}
  - {from: dataset_source, to: metrics, input: reference_transcription}
  - {from: dataset_source, to: metrics, input: relevant_docs}
  - {from: embedding_alignment_metrics, to: metrics, input: embedding_alignment}
  - {from: retrieval_metrics, to: metrics, input: per_query_recall5}
  - {from: retrieval, to: build_query_traces, input: retrieved}
  - {from: metrics, to: build_query_traces, input: metrics}
  - {from: dataset_source, to: build_query_traces, input: reference_transcription}
  - {from: dataset_source, to: build_query_traces, input: relevant_docs}
  - {from: retrieval_metrics, to: build_query_traces, input: per_query_recall5}
  - {from: metrics, to: finalize, input: metrics}
  - {from: build_query_traces, to: finalize, input: query_traces}
  - {from: retrieval, to: finalize, input: retrieved}
nodes:
  audio_embedding:
    model: attention_pool
    size: medium
    dim: 2048
    model_path: null
    device: cuda:0
  text_embedding:
    model: jina_v4
    name: jinaai/jina-embeddings-v4
    device: cuda:1
  vector_db:
    store: inmemory
  retrieval:
    k: 10
runtime:
  cache:
    enabled: true
    cache_dir: .cache
    cache_asr_features: false
    cache_transcriptions: false
    cache_embeddings: true
    cache_vector_db: true
  logging:
    console_level: INFO
    file_level: DEBUG
