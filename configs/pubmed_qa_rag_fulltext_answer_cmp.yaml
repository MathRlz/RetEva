  - {from: dataset_source, to: corpus_embedding_sonar, input: corpus}
  - {from: corpus_embedding_sonar, to: vector_db_sonar, input: corpus_vectors}
  - {from: dataset_source, output: reference_text, to: text_embedding_text, input: query_text}
  - {from: asr, to: text_embedding_cascade, input: query_text}
  - {from: tts, to: audio_embedding_sonar, input: query_audio}
