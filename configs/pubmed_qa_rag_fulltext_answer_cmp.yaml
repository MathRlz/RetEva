llm:
  model: gemma4:latest
  use_local_server: true
  local_server_url: http://localhost:11434/v1/chat/completions
  api_key_env: DUMMY_KEY
  temperature: 0.0
  # set concurrency: 1 for a run you will quote (bit-reproducibility; see rag_fulltext.yaml)
  concurrency: 2
  seed: 42
  timeout_s: 600
runtime:
  cache:
    enabled: true
    cache_dir: .cache
    cache_embeddings: true
    cache_vector_db: true
  logging:
    console_level: INFO
    file_level: DEBUG
