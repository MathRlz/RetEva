# RAG measurement 1: does a retrieval-ranking advantage survive GENERATION?
#
# Three retrieval arms feed the SAME generator (one model, one prompt, oracle question
# text in the prompt for ALL arms — the only thing that differs between arms is the
# retrieved CONTEXT, so an answer-quality delta is attributable to retrieval alone):
#
#   text    — reference_text -> labse -> retrieval            (text ceiling)
#   cascade — tts -> whisper ASR -> labse -> retrieval        (spoken, ASR-mediated)
#   sonar   — tts -> sonar_speech -> retrieval vs sonar corpus (spoken, latent/no-ASR)
#
# Outputs per arm: decision accuracy (yes/no/maybe), ROUGE, context coverage
# (answer_metrics), retrieval metrics, LLM-judge aspects. Also feeds measurement 4
# (generation robustness): compare sonar vs cascade answer quality against their
# retrieval gap.
#
# NOTE on reproducibility: generation + judge run through an LLM server; even with
# temperature 0 + seed, server-side batching (concurrency > 1) breaks bit-reproducibility.
# Set llm.concurrency: 1 for a quotable run. State this beside any results table.
experiment:
  name: pubmed_qa_rag_fulltext_answer_cmp
  output_dir: evaluation_results
# PUBMED_QA_FULLTEXT_DATASET -- dir with the 115-question FULL-TEXT set (questions.json +
# corpus.json; build: scripts/build_pubmed_campaign.py --full-text). Export before running.
dataset:
  id: pubmed_qa
  questions: ${PUBMED_QA_FULLTEXT_DATASET}/questions.json
  corpus: ${PUBMED_QA_FULLTEXT_DATASET}/corpus.json
  trace_limit: 0        # every question runs and is traced (the judge needs traces)
  batch_size: 8
data:
  num_workers: 0
graph:
  nodes:
  - dataset_source
  - id: tts
    type: tts
    params:
      provider: xtts_v2
      language: en
      sample_rate: 16000
      seed: 42
      output_dir: evaluation_results/pubmed_qa_rag_fulltext_answer_cmp/audio
      device: "cuda:0"
  - id: asr
    type: asr
    params:
      model: whisper
      size: large-v2
      device: "cuda:0"
  - id: corpus_embedding_labse
    type: corpus_embedding
    params:
      model: labse
      device: "cuda:1"
  - id: vector_db_labse
    type: vector_db
    params:
      store: inmemory
  - id: corpus_embedding_sonar
    type: corpus_embedding
    params:
      model: sonar
      embedding_space: sonar
      device: "cuda:1"
  - id: vector_db_sonar
    type: vector_db
    params:
      store: inmemory
  - id: text_embedding_text
    type: text_embedding
    params:
      model: labse
      device: "cuda:1"
  - id: text_embedding_cascade
    type: text_embedding
    params:
      model: labse
      device: "cuda:1"
  - id: audio_embedding_sonar
    type: audio_embedding
    params:
      model: sonar_speech
      embedding_space: sonar
      device: "cuda:0"
  - id: retrieval_text
    type: retrieval
    params:
      k: 10
  - id: answer_gen_text
    type: answer_gen
    params:
      method: simple
      max_cases: 0       # 0 = generate for every query
      # ONE prompt, ONE model across every arm and config in this measurement set —
      # the experiment varies RETRIEVAL only (spelled out so code-default changes
      # cannot silently alter a reported run).
      system_prompt: |-
        You are a concise medical research assistant. Answer based ONLY on the provided context. Be brief and direct.
        Reply in exactly this format, nothing before it:
        Short Answer: yes or no or maybe
        Long Answer: <your detailed answer>
      prompt_template: |-
        Context:
        {context}

        Question: {question}

        Short Answer:
      compute_rouge: true
      reference_metadata_field: long_answer
      context_source: full_text
      context_chunk_chars: 1200
      context_chunks: 4
      context_docs: 3
  - id: retrieval_metrics_text
    type: retrieval_metrics
  - id: answer_metrics_text
    type: answer_metrics
  - id: metrics_text
    type: metrics
  - id: build_query_traces_text
    type: build_query_traces
  - id: answer_judge_text
    type: answer_judge
    params:
      max_cases: 0     # judge EVERY trace
      system_prompt: |-
        You are an expert evaluator for a medical question-answering retrieval system. Score each requested aspect from 0.0 (worst) to 1.0 (best). Be strict and consistent. Respond with STRICT JSON only — no prose, no markdown.
  - id: finalize_text
    type: finalize
  - id: retrieval_cascade
    type: retrieval
    params:
      k: 10
  - id: answer_gen_cascade
    type: answer_gen
    params:
      method: simple
      max_cases: 0       # 0 = generate for every query
      # ONE prompt, ONE model across every arm and config in this measurement set —
      # the experiment varies RETRIEVAL only (spelled out so code-default changes
      # cannot silently alter a reported run).
      system_prompt: |-
        You are a concise medical research assistant. Answer based ONLY on the provided context. Be brief and direct.
        Reply in exactly this format, nothing before it:
        Short Answer: yes or no or maybe
        Long Answer: <your detailed answer>
      prompt_template: |-
        Context:
        {context}

        Question: {question}

        Short Answer:
      compute_rouge: true
      reference_metadata_field: long_answer
      context_source: full_text
      context_chunk_chars: 1200
      context_chunks: 4
      context_docs: 3
  - id: retrieval_metrics_cascade
    type: retrieval_metrics
  - id: answer_metrics_cascade
    type: answer_metrics
  - id: metrics_cascade
    type: metrics
  - id: build_query_traces_cascade
    type: build_query_traces
  - id: answer_judge_cascade
    type: answer_judge
    params:
      max_cases: 0     # judge EVERY trace
      system_prompt: |-
        You are an expert evaluator for a medical question-answering retrieval system. Score each requested aspect from 0.0 (worst) to 1.0 (best). Be strict and consistent. Respond with STRICT JSON only — no prose, no markdown.
  - id: finalize_cascade
    type: finalize
  - id: retrieval_sonar
    type: retrieval
    params:
      k: 10
  - id: answer_gen_sonar
    type: answer_gen
    params:
      method: simple
      max_cases: 0       # 0 = generate for every query
      # ONE prompt, ONE model across every arm and config in this measurement set —
      # the experiment varies RETRIEVAL only (spelled out so code-default changes
      # cannot silently alter a reported run).
      system_prompt: |-
        You are a concise medical research assistant. Answer based ONLY on the provided context. Be brief and direct.
        Reply in exactly this format, nothing before it:
        Short Answer: yes or no or maybe
        Long Answer: <your detailed answer>
      prompt_template: |-
        Context:
        {context}

        Question: {question}

        Short Answer:
      compute_rouge: true
      reference_metadata_field: long_answer
      context_source: full_text
      context_chunk_chars: 1200
      context_chunks: 4
      context_docs: 3
  - id: retrieval_metrics_sonar
    type: retrieval_metrics
  - id: answer_metrics_sonar
    type: answer_metrics
  - id: metrics_sonar
    type: metrics
  - id: build_query_traces_sonar
    type: build_query_traces
  - id: answer_judge_sonar
    type: answer_judge
    params:
      max_cases: 0     # judge EVERY trace
      system_prompt: |-
        You are an expert evaluator for a medical question-answering retrieval system. Score each requested aspect from 0.0 (worst) to 1.0 (best). Be strict and consistent. Respond with STRICT JSON only — no prose, no markdown.
  - id: finalize_sonar
    type: finalize

