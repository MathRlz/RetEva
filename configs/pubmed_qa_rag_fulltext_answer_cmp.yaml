  - {from: dataset_source, to: answer_metrics_text, input: relevant_docs}
  - {from: dataset_source, to: answer_metrics_text, input: short_answers}
  - {from: retrieval_metrics_text, to: metrics_text, input: retrieval_scores}
  - {from: answer_metrics_text, to: metrics_text, input: answer_scores}
  - {from: retrieval_text, to: metrics_text, input: retrieved}
  - {from: dataset_source, to: metrics_text, input: reference_transcription}
  - {from: dataset_source, to: metrics_text, input: relevant_docs}
