# AUTO-GENERATED by scripts/rerun/trim_noise_configs.py from configs/pubmed_qa_tts_asr_embed_noise_snr10_cmp.yaml (dropped: m4t, piper, wav2vec2)
experiment:
  name: pubmed_qa_tts_asr_embed_noise_snr10_cmp
  output_dir: evaluation_results
dataset:
  id: pubmed_qa
  questions: ${PUBMED_QA_DATASET}/questions.json
  corpus: ${PUBMED_QA_DATASET}/corpus.json
  trace_limit: 0
  batch_size: 8
data:
  num_workers: 0
graph:
  nodes:
  - dataset_source
  - id: tts_xtts
    type: tts
    params:
      provider: xtts_v2
      language: en
      sample_rate: 16000
      seed: 42
      output_dir: evaluation_results/pubmed_qa_tts_asr_embed_noise_snr10_cmp/xtts/audio
      device: cuda:0
  - id: augment_xtts
    type: augment_audio
    params:
      add_noise: true
      noise_type: white
      snr_db: 10.0
      speed_perturbation: false
      n_variants: 1
  - id: corpus_embedding_jina
    type: corpus_embedding
    params:
      model: jina_v4
      name: jinaai/jina-embeddings-v4
      device: cuda:1
  - id: vector_db_jina
    type: vector_db
    params:
      store: inmemory
  - id: corpus_embedding_labse
    type: corpus_embedding
    params:
      model: labse
      device: cuda:1
  - id: vector_db_labse
    type: vector_db
    params:
      store: inmemory
  - id: asr_xtts_whisper
    type: asr
    params:
      model: whisper
      size: large-v2
      device: cuda:0
  - id: text_embedding_xtts_whisper_jina
    type: text_embedding
    params:
      model: jina_v4
      name: jinaai/jina-embeddings-v4
      device: cuda:1
  - id: retrieval_xtts_whisper_jina
    type: retrieval
    params:
      k: 10
  - id: text_embedding_xtts_whisper_labse
    type: text_embedding
    params:
      model: labse
      device: cuda:1
  - id: retrieval_xtts_whisper_labse
    type: retrieval
    params:
      k: 10
  - id: corpus_embedding_sonar
    type: corpus_embedding
    params:
      model: sonar
      embedding_space: sonar
      device: cuda:1
  - id: vector_db_sonar
    type: vector_db
    params:
      store: inmemory
  - id: text_embedding_xtts_whisper_sonar
    type: text_embedding
    params:
      model: sonar
      embedding_space: sonar
      device: cuda:1
  - id: retrieval_xtts_whisper_sonar
    type: retrieval
    params:
      k: 10
  edges:
  - from: dataset_source
    to: tts_xtts
    input: query_text
  - from: tts_xtts
    to: augment_xtts
    input: query_audio
  - from: dataset_source
    to: corpus_embedding_jina
    input: corpus
  - from: corpus_embedding_jina
    to: vector_db_jina
    input: corpus_vectors
  - from: dataset_source
    to: corpus_embedding_labse
    input: corpus
  - from: corpus_embedding_labse
    to: vector_db_labse
    input: corpus_vectors
  - from: augment_xtts
    to: asr_xtts_whisper
    input: query_audio
  - from: asr_xtts_whisper
    to: text_embedding_xtts_whisper_jina
    input: query_text
  - from: text_embedding_xtts_whisper_jina
    output: text_query_vectors
    to: retrieval_xtts_whisper_jina
    input: query_vectors
  - from: vector_db_jina
    to: retrieval_xtts_whisper_jina
    input: vector_index
  - from: asr_xtts_whisper
    to: retrieval_xtts_whisper_jina
    input: query_text
  - from: dataset_source
    to: retrieval_xtts_whisper_jina
    input: reference_transcription
  - from: dataset_source
    to: retrieval_xtts_whisper_jina
    input: relevant_docs
  - from: asr_xtts_whisper
    to: text_embedding_xtts_whisper_labse
    input: query_text
  - from: text_embedding_xtts_whisper_labse
    output: text_query_vectors
    to: retrieval_xtts_whisper_labse
    input: query_vectors
  - from: vector_db_labse
    to: retrieval_xtts_whisper_labse
    input: vector_index
  - from: asr_xtts_whisper
    to: retrieval_xtts_whisper_labse
    input: query_text
  - from: dataset_source
    to: retrieval_xtts_whisper_labse
    input: reference_transcription
  - from: dataset_source
    to: retrieval_xtts_whisper_labse
    input: relevant_docs
  - from: dataset_source
    to: corpus_embedding_sonar
    input: corpus
  - from: corpus_embedding_sonar
    to: vector_db_sonar
    input: corpus_vectors
  - from: asr_xtts_whisper
    to: text_embedding_xtts_whisper_sonar
    input: query_text
  - from: text_embedding_xtts_whisper_sonar
    output: text_query_vectors
    to: retrieval_xtts_whisper_sonar
    input: query_vectors
  - from: vector_db_sonar
    to: retrieval_xtts_whisper_sonar
    input: vector_index
  - from: asr_xtts_whisper
    to: retrieval_xtts_whisper_sonar
    input: query_text
  - from: dataset_source
    to: retrieval_xtts_whisper_sonar
    input: reference_transcription
  - from: dataset_source
    to: retrieval_xtts_whisper_sonar
    input: relevant_docs
service_runtime:
  startup_mode: lazy
  offload_policy: on_use_soft_cpu
  soft_offload_max_warm: 6
device_pool:
  available_devices:
  - auto
  memory_buffer_percent: 0.1
  allow_gpu_eviction: true
  allow_cpu_fallback: true
runtime:
  cache:
    enabled: true
    cache_dir: .cache
    cache_asr_features: true
    cache_transcriptions: true
    cache_embeddings: true
    cache_vector_db: true
  logging:
    console_level: INFO
    file_level: DEBUG
