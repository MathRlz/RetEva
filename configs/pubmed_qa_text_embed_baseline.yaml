# Clean-text retrieval baseline on pubmed_qa (no TTS, no ASR, no generation).
#
# Pipeline per variant: dataset_source.query_text -> text_embedding -> retrieval, with the
# corpus embedded by the SAME model. This is the UPPER BOUND for each embedding space: any
# TTS->ASR->text_embedding chain (pubmed_qa_tts_asr_embed_cmp) or TTS->audio_embedding
# chain (pubmed_qa_tts_audioemb_cmp) can at best match its own model's row here — the gap
# is the cost of the speech round-trip.
#
# 3 variants:
#   jina  — jina_v4 (jinaai/jina-embeddings-v4), the space the APM audio embedders target
#   labse — LaBSE (the second text axis of the tts/asr cmp)
#   eam   — side/eam AlignmentModel TEXT side on both query and corpus (upper bound for
#           the eam audio pair; needs EAM_CHECKPOINT_DIR)
#
# Only MEANINGFUL nodes written; retrieval_metrics/metrics/finalize auto-appended per
# retrieval variant (complete_structural_plumbing).
experiment:
  name: pubmed_qa_text_embed_baseline
  output_dir: evaluation_results

dataset:
  id: pubmed_qa
  questions: questions.json
  corpus: corpus.json
  trace_limit: 0
  batch_size: 8

data:
  num_workers: 0

graph:
  nodes:
  - dataset_source
  - id: corpus_embedding_jina
    type: corpus_embedding
    params:
      model: jina_v4
      name: jinaai/jina-embeddings-v4
      embedding_space: jina_v4_space
      device: "cuda:1"
  - id: vector_db_jina
    type: vector_db
    params:
      store: inmemory
  - id: text_embedding_jina
    type: text_embedding
    params:
      model: jina_v4
      name: jinaai/jina-embeddings-v4
      embedding_space: jina_v4_space
      device: "cuda:1"
  - id: retrieval_jina
    type: retrieval
  - id: corpus_embedding_labse
    type: corpus_embedding
    params:
      model: labse
      embedding_space: labse_space
      device: "cuda:1"
  - id: vector_db_labse
    type: vector_db
    params:
      store: inmemory
  - id: text_embedding_labse
    type: text_embedding
    params:
      model: labse
      embedding_space: labse_space
      device: "cuda:1"
  - id: retrieval_labse
    type: retrieval
  - id: corpus_embedding_eam
    type: corpus_embedding
    params:
      model: eam_alignment
      size: v2-large
      model_path: "${EAM_CHECKPOINT_DIR}/eam_alignment.pt"
      config_path: "${EAM_CHECKPOINT_DIR}/model.json"
      embedding_space: eam_space
      device: "cuda:1"
  - id: vector_db_eam
    type: vector_db
    params:
      store: inmemory
  - id: text_embedding_eam
    type: text_embedding
    params:
      model: eam_alignment
      size: v2-large
      model_path: "${EAM_CHECKPOINT_DIR}/eam_alignment.pt"
      config_path: "${EAM_CHECKPOINT_DIR}/model.json"
      embedding_space: eam_space
      device: "cuda:1"
  - id: retrieval_eam
    type: retrieval

  edges:
  - {from: dataset_source, to: corpus_embedding_jina, input: corpus}
  - {from: corpus_embedding_jina, to: vector_db_jina, input: corpus_vectors}
  - {from: dataset_source, to: text_embedding_jina, input: query_text}
  - {from: text_embedding_jina, output: text_query_vectors, to: retrieval_jina, input: query_vectors}
  - {from: vector_db_jina, to: retrieval_jina, input: vector_index}
  - {from: dataset_source, to: retrieval_jina, input: query_text}
  - {from: dataset_source, to: retrieval_jina, input: reference_transcription}
  - {from: dataset_source, to: retrieval_jina, input: relevant_docs}
  - {from: dataset_source, to: corpus_embedding_labse, input: corpus}
  - {from: corpus_embedding_labse, to: vector_db_labse, input: corpus_vectors}
  - {from: dataset_source, to: text_embedding_labse, input: query_text}
  - {from: text_embedding_labse, output: text_query_vectors, to: retrieval_labse, input: query_vectors}
  - {from: vector_db_labse, to: retrieval_labse, input: vector_index}
  - {from: dataset_source, to: retrieval_labse, input: query_text}
  - {from: dataset_source, to: retrieval_labse, input: reference_transcription}
  - {from: dataset_source, to: retrieval_labse, input: relevant_docs}
  - {from: dataset_source, to: corpus_embedding_eam, input: corpus}
  - {from: corpus_embedding_eam, to: vector_db_eam, input: corpus_vectors}
  - {from: dataset_source, to: text_embedding_eam, input: query_text}
  - {from: text_embedding_eam, output: text_query_vectors, to: retrieval_eam, input: query_vectors}
  - {from: vector_db_eam, to: retrieval_eam, input: vector_index}
  - {from: dataset_source, to: retrieval_eam, input: query_text}
  - {from: dataset_source, to: retrieval_eam, input: reference_transcription}
  - {from: dataset_source, to: retrieval_eam, input: relevant_docs}

runtime:
  cache:
    enabled: true
    cache_dir: .cache
    cache_asr_features: true
    cache_transcriptions: true
    cache_embeddings: true
    cache_vector_db: true
  logging:
    console_level: INFO
    file_level: DEBUG
