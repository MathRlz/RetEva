# APM self-retrieval (audio_emb) — SeamlessM4T-v2 encoder, attention pooling, on admed (test split).
# Audio query embedded by the APM into the text-embedder space and matched against the
# transcription corpus (self-retrieval). Cross-modal alignment lives in the trained
# attention-pool weights — set audio_embedding.model_path (.pt) for meaningful numbers.
experiment:
  name: apm_admed_m4t_attention
  output_dir: evaluation_results
dataset:
  id: admed_voice
  path: /home/student5/datasets/admed_voice
  split: test
  batch_size: 32
data:
  num_workers: 4
  test_size: 0.3
graph:
  nodes:
  - dataset_source
  - corpus_embedding
  - vector_db
  - audio_embedding
  - retrieval
  - retrieval_metrics
  - metrics
  - finalize
nodes:
  audio_embedding:
    model: attention_pool_m4t
    size: v2-large
    dim: 2048
    dropout: 0.1
    embedding_space: jina_v4_space
    params:
      pooling: attention
    model_path: /home/student5/scripts/attention_pool_model/apm_m4t_jina_admed_voice_attention_whitening.pt
    device: cuda:0
  text_embedding:
    model: jina_v4
    name: jinaai/jina-embeddings-v4
    embedding_space: jina_v4_space
    device: cuda:1
  vector_db:
    store: inmemory
  retrieval:
    k: 5
runtime:
  cache:
    enabled: true
    cache_dir: .cache
    cache_asr_features: false
    cache_transcriptions: false
    cache_embeddings: true
    cache_vector_db: true
  logging:
    console_level: INFO
    file_level: DEBUG
