# ADMED self-retrieval — v2: audio embedding (cross-modal).
# Same "fake" retrieval target as v1 — the vector DB holds the TEXT transcriptions — but the
# query side skips ASR: the audio is embedded directly and matched against the text corpus.
# This only works with a JOINT audio<->text space: attention_pool projects the Whisper-encoder
# audio into the text embedder's space (emb_dim must match; model_path = the trained alignment).
# SONAR alternative (self-contained, no model_path): set audio_embedding.model: sonar_speech +
# audio_embedding.size: eng, and text_embedding.model: sonar.
experiment:
  name: admed_selfretr_audio_emb
  output_dir: evaluation_results
dataset:
  id: admed_voice
  path: null
  split: both
  batch_size: 32
data:
  num_workers: 4
  test_size: 0.0
graph:
  nodes:
  - dataset_source
  - corpus_embedding
  - vector_db
  - audio_embedding
  - retrieval
  - retrieval_metrics
  - metrics
  - finalize
  edges:
  - {from: dataset_source, to: corpus_embedding, input: corpus}
  - {from: corpus_embedding, to: vector_db, input: corpus_vectors}
  - {from: dataset_source, to: audio_embedding, input: query_audio}
  - {from: audio_embedding, output: audio_query_vectors, to: retrieval, input: query_vectors}
  - {from: vector_db, to: retrieval, input: vector_index}
  - {from: dataset_source, to: retrieval, input: query_text}
  - {from: dataset_source, to: retrieval, input: reference_transcription}
  - {from: dataset_source, to: retrieval, input: relevant_docs}
  - {from: retrieval, to: retrieval_metrics, input: retrieved}
  - {from: dataset_source, to: retrieval_metrics, input: relevant_docs}
  - {from: retrieval_metrics, to: metrics, input: retrieval_scores}
  - {from: retrieval, to: metrics, input: retrieved}
  - {from: dataset_source, to: metrics, input: query_text}
  - {from: dataset_source, to: metrics, input: reference_transcription}
  - {from: dataset_source, to: metrics, input: relevant_docs}
  - {from: retrieval_metrics, to: metrics, input: per_query_recall5}
  - {from: metrics, to: finalize, input: metrics}
  - {from: retrieval, to: finalize, input: retrieved}
nodes:
  audio_embedding:
    model: attention_pool
    size: medium
    dim: 2048
    model_path: null
    device: cuda:0
  text_embedding:
    model: jina_v4
    name: jinaai/jina-embeddings-v4
    device: cuda:1
  vector_db:
    store: inmemory
  retrieval:
    k: 10
runtime:
  cache:
    enabled: true
    cache_dir: .cache
    cache_asr_features: false
    cache_transcriptions: false
    cache_embeddings: true
    cache_vector_db: true
  logging:
    console_level: INFO
    file_level: DEBUG
