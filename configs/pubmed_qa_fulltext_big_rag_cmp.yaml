# RAG retrieval strategy comparison on pubmed_qa_fulltext_big.
#
# One graph: dataset_source/corpus_embedding/vector_db/text_embedding are shared (each has
# multiple outgoing edges); five distinctly-named retrieval nodes diverge from there, each
# with its own answer_gen/metrics/judge chain. No graph.branches.
#
# Variants:
#   dense            — cosine dense retrieval only (labse vectors)
#   sparse           — BM25 lexical retrieval only
#   hybrid_linear    — dense + sparse, linear fusion (dense_weight 0.6)
#   hybrid_rrf       — dense + sparse, reciprocal rank fusion (k=60)
#   hybrid_rrf_rerank — RRF + token-overlap reranker (top_k 30)
#
# Two-hop query rewrite (query_refine node) requires a different graph topology and isn't
# one of these variants — see pubmed_qa_rag_fulltext_refine.yaml.
#
# COST: 5 × full sweep (1209 questions each) for answer_gen/answer_judge (they always varied
# per variant since retrieval differs). Start:
#   OLLAMA_NUM_PARALLEL=4 OLLAMA_CONTEXT_LENGTH=8192 ollama serve
experiment:
  name: pubmed_qa_fulltext_big_rag_cmp
  output_dir: evaluation_results

dataset:
  id: pubmed_qa
  questions: examples/data/pubmed_qa_fulltext_big/questions.json
  corpus: examples/data/pubmed_qa_fulltext_big/corpus.json
  trace_limit: 0
  batch_size: 8

data:
  num_workers: 0

vector_db:
  bm25_k1: 1.5
  bm25_b: 0.75

nodes:
  text_embedding:
    model: labse
    device: cuda:1
  vector_db:
    store: inmemory

graph:
  nodes:
  - dataset_source
  - corpus_embedding
  - vector_db
  - text_embedding
  - id: retrieval_dense
    type: retrieval
    params: {k: 10, mode: dense}
  - id: retrieval_sparse
    type: retrieval
    params: {k: 10, mode: sparse}
  - id: retrieval_hybrid_linear
    type: retrieval
    params:
      k: 10
      mode: hybrid
      fusion: {method: linear, dense_weight: 0.6}
  - id: retrieval_hybrid_rrf
    type: retrieval
    params:
      k: 10
      mode: hybrid
      fusion: {method: rrf, rrf_k: 60}
  - id: retrieval_hybrid_rrf_rerank
    type: retrieval
    params:
      k: 10
      mode: hybrid
      fusion: {method: rrf, rrf_k: 60}
      reranker: {mode: token_overlap, top_k: 30}
  - &answer_gen_dense
    id: answer_gen_dense
    type: answer_gen
    params: &answer_gen_params
      method: simple
      max_cases: 0
      system_prompt: |-
        You are a concise medical research assistant. Answer based ONLY on the provided context. Be brief and direct.
        Reply in exactly this format, nothing before it:
        Short Answer: yes or no or maybe
        Long Answer: <your detailed answer>
      prompt_template: |-
        Context:
        {context}

        Question: {question}

        Short Answer:
      context_docs: 3
      compute_rouge: true
      reference_metadata_field: long_answer
      context_source: full_text
      context_chunk_chars: 1200
      context_chunks: 4
  - id: answer_gen_sparse
    type: answer_gen
    params: *answer_gen_params
  - id: answer_gen_hybrid_linear
    type: answer_gen
    params: *answer_gen_params
  - id: answer_gen_hybrid_rrf
    type: answer_gen
    params: *answer_gen_params
  - id: answer_gen_hybrid_rrf_rerank
    type: answer_gen
    params: *answer_gen_params
  - id: retrieval_metrics_dense
    type: retrieval_metrics
  - id: retrieval_metrics_sparse
    type: retrieval_metrics
  - id: retrieval_metrics_hybrid_linear
    type: retrieval_metrics
  - id: retrieval_metrics_hybrid_rrf
    type: retrieval_metrics
  - id: retrieval_metrics_hybrid_rrf_rerank
    type: retrieval_metrics
  - id: answer_metrics_dense
    type: answer_metrics
  - id: answer_metrics_sparse
    type: answer_metrics
  - id: answer_metrics_hybrid_linear
    type: answer_metrics
  - id: answer_metrics_hybrid_rrf
    type: answer_metrics
  - id: answer_metrics_hybrid_rrf_rerank
    type: answer_metrics
  - id: metrics_dense
    type: metrics
  - id: metrics_sparse
    type: metrics
  - id: metrics_hybrid_linear
    type: metrics
  - id: metrics_hybrid_rrf
    type: metrics
  - id: metrics_hybrid_rrf_rerank
    type: metrics
  - id: build_query_traces_dense
    type: build_query_traces
  - id: build_query_traces_sparse
    type: build_query_traces
  - id: build_query_traces_hybrid_linear
    type: build_query_traces
  - id: build_query_traces_hybrid_rrf
    type: build_query_traces
  - id: build_query_traces_hybrid_rrf_rerank
    type: build_query_traces
  - &answer_judge_dense
    id: answer_judge_dense
    type: answer_judge
    params: &answer_judge_params
      max_cases: 0
      system_prompt: |-
        You are an expert evaluator for a medical question-answering retrieval system. Score each requested aspect from 0.0 (worst) to 1.0 (best). Be strict and consistent. Respond with STRICT JSON only — no prose, no markdown.
  - id: answer_judge_sparse
    type: answer_judge
    params: *answer_judge_params
  - id: answer_judge_hybrid_linear
    type: answer_judge
    params: *answer_judge_params
  - id: answer_judge_hybrid_rrf
    type: answer_judge
    params: *answer_judge_params
  - id: answer_judge_hybrid_rrf_rerank
    type: answer_judge
    params: *answer_judge_params
  - id: finalize_dense
    type: finalize
  - id: finalize_sparse
    type: finalize
  - id: finalize_hybrid_linear
    type: finalize
  - id: finalize_hybrid_rrf
    type: finalize
  - id: finalize_hybrid_rrf_rerank
    type: finalize
