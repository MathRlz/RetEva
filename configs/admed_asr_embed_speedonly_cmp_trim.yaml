# AUTO-GENERATED by scripts/rerun/trim_noise_configs.py from configs/admed_asr_embed_speedonly_cmp.yaml (dropped: m4t, wav2vec2, whisper_lora)
experiment:
  name: admed_asr_embed_speedonly_cmp
  output_dir: evaluation_results
dataset:
  id: admed_voice
  path: ${ADMED_VOICE_PATH}
  split: test
  batch_size: 8
data:
  num_workers: 4
  test_size: 0.3
graph:
  nodes:
  - dataset_source
  - id: augment
    type: augment_audio
    params:
      add_noise: false
      noise_type: white
      snr_db: 15.0
      speed_perturbation: true
      n_variants: 1
  - id: corpus_embedding_jina
    type: corpus_embedding
    params:
      model: jina_v4
      name: jinaai/jina-embeddings-v4
      embedding_space: jina_v4_space
      device: cuda:1
  - id: vector_db_jina
    type: vector_db
    params:
      store: inmemory
  - id: corpus_embedding_labse
    type: corpus_embedding
    params:
      model: labse
      embedding_space: labse_space
      device: cuda:1
  - id: vector_db_labse
    type: vector_db
    params:
      store: inmemory
  - id: corpus_embedding_sonar
    type: corpus_embedding
    params:
      model: sonar
      params:
        source_lang: pol_Latn
      embedding_space: sonar
      device: cuda:1
  - id: vector_db_sonar
    type: vector_db
    params:
      store: inmemory
  - id: asr_whisper
    type: asr
    params:
      model: whisper
      size: large-v2
      device: cuda:0
  - id: text_embedding_whisper_jina
    type: text_embedding
    params:
      model: jina_v4
      name: jinaai/jina-embeddings-v4
      embedding_space: jina_v4_space
      device: cuda:1
  - id: retrieval_whisper_jina
    type: retrieval
  - id: text_embedding_whisper_labse
    type: text_embedding
    params:
      model: labse
      embedding_space: labse_space
      device: cuda:1
  - id: retrieval_whisper_labse
    type: retrieval
  - id: text_embedding_whisper_sonar
    type: text_embedding
    params:
      model: sonar
      params:
        source_lang: pol_Latn
      embedding_space: sonar
      device: cuda:1
  - id: retrieval_whisper_sonar
    type: retrieval
  edges:
  - from: dataset_source
    to: augment
    input: query_audio
  - from: dataset_source
    to: corpus_embedding_jina
    input: corpus
  - from: corpus_embedding_jina
    to: vector_db_jina
    input: corpus_vectors
  - from: dataset_source
    to: corpus_embedding_labse
    input: corpus
  - from: corpus_embedding_labse
    to: vector_db_labse
    input: corpus_vectors
  - from: dataset_source
    to: corpus_embedding_sonar
    input: corpus
  - from: corpus_embedding_sonar
    to: vector_db_sonar
    input: corpus_vectors
  - from: augment
    to: asr_whisper
    input: query_audio
  - from: asr_whisper
    to: text_embedding_whisper_jina
    input: query_text
  - from: text_embedding_whisper_jina
    output: text_query_vectors
    to: retrieval_whisper_jina
    input: query_vectors
  - from: vector_db_jina
    to: retrieval_whisper_jina
    input: vector_index
  - from: asr_whisper
    to: retrieval_whisper_jina
    input: query_text
  - from: dataset_source
    to: retrieval_whisper_jina
    input: reference_transcription
  - from: dataset_source
    to: retrieval_whisper_jina
    input: relevant_docs
  - from: asr_whisper
    to: text_embedding_whisper_labse
    input: query_text
  - from: text_embedding_whisper_labse
    output: text_query_vectors
    to: retrieval_whisper_labse
    input: query_vectors
  - from: vector_db_labse
    to: retrieval_whisper_labse
    input: vector_index
  - from: asr_whisper
    to: retrieval_whisper_labse
    input: query_text
  - from: dataset_source
    to: retrieval_whisper_labse
    input: reference_transcription
  - from: dataset_source
    to: retrieval_whisper_labse
    input: relevant_docs
  - from: asr_whisper
    to: text_embedding_whisper_sonar
    input: query_text
  - from: text_embedding_whisper_sonar
    output: text_query_vectors
    to: retrieval_whisper_sonar
    input: query_vectors
  - from: vector_db_sonar
    to: retrieval_whisper_sonar
    input: vector_index
  - from: asr_whisper
    to: retrieval_whisper_sonar
    input: query_text
  - from: dataset_source
    to: retrieval_whisper_sonar
    input: reference_transcription
  - from: dataset_source
    to: retrieval_whisper_sonar
    input: relevant_docs
service_runtime:
  startup_mode: lazy
  offload_policy: on_use_soft_cpu
  soft_offload_max_warm: 6
device_pool:
  available_devices:
  - auto
  memory_buffer_percent: 0.1
  allow_gpu_eviction: true
  allow_cpu_fallback: true
runtime:
  cache:
    enabled: true
    cache_dir: .cache
    cache_asr_features: true
    cache_transcriptions: true
    cache_embeddings: true
    cache_vector_db: true
  logging:
    console_level: INFO
    file_level: DEBUG
