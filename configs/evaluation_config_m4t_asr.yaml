experiment:
  name: m4t_asr_pubmed_qa_large
  output_dir: evaluation_results
dataset:
  id: pubmed_qa
  questions: examples/data/pubmedqa/questions.json
  corpus: examples/data/pubmedqa/corpus.json
  trace_limit: 0
  batch_size: 4
data:
  strict_validation: false
  num_workers: 0
graph:
  nodes:
  - dataset_source
  - id: tts
    type: tts
    params:
      provider: mms
      language: en
      voice: en_US-lessac-medium
      sample_rate: 16000
      seed: 42
      output_dir: examples/data/pubmedqa/audio
  - corpus_embedding
  - vector_db
  - asr
  - id: query_correction
    type: query_correction
    params:
      method: kb
      use_default_rules: true
      kb_max_distance: 1
  - id: query_optimization
    type: query_optimization
    params:
      method: rewrite
      use_local_server: true
      local_server_url: http://localhost:11434/v1/chat/completions
      model: llama3.1
      temperature: 0.3
      max_iterations: 2
      use_initial_context: false
      timeout_s: 30
  - text_embedding
  - retrieval
  - transcription_metrics
  - retrieval_metrics
  - metrics
  - finalize
nodes:
  asr:
    model: seamless_m4t
    name: facebook/seamless-m4t-v2-large
    params:
      tgt_lang: eng
    device: cuda:0
  text_embedding:
    model: labse
    device: cuda:0
  vector_db:
    store: inmemory
  retrieval:
    k: 10
    gpu_id: 0
runtime:
  cache:
    enabled: true
    cache_dir: .cache
    cache_asr_features: true
    cache_transcriptions: true
    cache_embeddings: true
    cache_vector_db: true
  logging:
    console_level: INFO
    file_level: DEBUG
  checkpoint_enabled: true
  checkpoint_interval: 100
  resume_from_checkpoint: true
