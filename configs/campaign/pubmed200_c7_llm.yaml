# LLM-ARM variant of pubmed200_c7_correction: adds the `llm` corrector branch.
# Requires a running local server: `ollama serve` + `ollama pull mistral:7b-instruct`.
# Without the llm: block below the branch would silently target the paid OpenAI API.
# CAMPAIGN copy of c7_correction_branches (the gate config keeps trace_limit: 5 —
# do not repoint it). Runs the 200-question campaign set so the paired corrector
# deltas clear the CI floor (n>=20) and the Wilcoxon test can reach significance.
# Build the data first: python3 scripts/build_pubmed_campaign.py -n 200
#
# CAVEAT for the thesis write-up: PubMedQA questions carry almost no drug/dose
# language, so plain `ceer` (dose units only) is ~0 for every branch here and
# `ceer_rx` fires on a small minority of items. This config measures the correctors'
# WER/CER + retrieval effect on research questions; the CEER safety story needs
# medication-style speech (admed / hani) — see configs/campaign/RUNBOOK.md.
# C7.7: the grounded-correction comparison — raw ASR vs each registered corrector as
# branches over ONE shared graph (tts -> whisper asr -> correction -> retrieval).
# `corrected_metrics: true` opts into the C7 metrics: corrected_wer/cer/ceer score each
# branch's corrected text; ceer_rx / corrected_ceer_rx use the drug-aware critical set
# (plain ceer counts dose units only). ceer_rx is identical across branches (same ASR
# hypothesis) — the per-branch correction effect is corrected_ceer_rx vs ceer_rx; the
# `asr` branch (no correction, sorts first -> report baseline) carries the raw reference.
# The llm branch needs an OpenAI-compatible endpoint — enable it in amazing_curie against
# Ollama (`ollama serve` first; use_local_server + local_server_url in the llm section).
experiment:
  name: pubmed200_c7_llm
  output_dir: evaluation_results/campaign
dataset:
  id: pubmed_qa
  questions: examples/data/pubmed_qa_campaign/questions.json
  corpus: examples/data/pubmed_qa_campaign/corpus.json
  trace_limit: 200   # whole set + traces (0 disables traces entirely)
  batch_size: 4
data:
  num_workers: 0
query_correction:
  corrected_metrics: true
graph:
  branches:
  - id: asr
    query_correction:
      enabled: false
  - id: rule
    query_correction:
      enabled: true
      method: rule
  - id: kb
    query_correction:
      enabled: true
      method: kb
  - id: phonetic
    query_correction:
      enabled: true
      method: phonetic
  - id: clinical
    query_correction:
      enabled: true
      method: clinical
  - id: llm
    query_correction:
      enabled: true
      method: llm
      constrain_to_vocab: true   # snap the LLM's output to the drug vocabulary
  nodes:
  - dataset_source
  - id: tts
    type: tts
    params:
      provider: mms
      voice: en
      sample_rate: 16000
      seed: 42
      output_dir: evaluation_results/campaign/audio
  - corpus_embedding
  - vector_db
  - asr
  - id: query_correction
    type: query_correction
    params:
      method: rule
  - text_embedding
  - retrieval
  - transcription_metrics
  - retrieval_metrics
  - metrics
  - build_query_traces
  - finalize
  edges:
  - {from: dataset_source, to: tts, input: query_text}
  - {from: dataset_source, to: corpus_embedding, input: corpus}
  - {from: corpus_embedding, to: vector_db, input: corpus_vectors}
  - {from: dataset_source, to: asr, input: query_audio}
  - {from: tts, to: asr, input: query_audio}
  - {from: dataset_source, to: asr, input: reference_transcription}
  - {from: dataset_source, to: query_correction, input: query_text}
  - {from: asr, to: query_correction, input: query_text}
  - {from: query_correction, output: corrected_query_text, to: text_embedding, input: query_text}
  - {from: dataset_source, to: text_embedding, input: query_text}
  - {from: asr, to: text_embedding, input: query_text}
  - {from: text_embedding, output: text_query_vectors, to: retrieval, input: query_vectors}
  - {from: vector_db, to: retrieval, input: vector_index}
  - {from: query_correction, output: corrected_query_text, to: retrieval, input: query_text}
  - {from: dataset_source, to: retrieval, input: query_text}
  - {from: asr, to: retrieval, input: query_text}
  - {from: dataset_source, to: retrieval, input: reference_transcription}
  - {from: dataset_source, to: retrieval, input: relevant_docs}
  - {from: dataset_source, to: transcription_metrics, input: query_text}
  - {from: asr, to: transcription_metrics, input: query_text}
  - {from: dataset_source, to: transcription_metrics, input: reference_transcription}
  - {from: retrieval, to: retrieval_metrics, input: retrieved}
  - {from: dataset_source, to: retrieval_metrics, input: relevant_docs}
  - {from: transcription_metrics, to: metrics, input: transcription_scores}
  - {from: retrieval_metrics, to: metrics, input: retrieval_scores}
  - {from: retrieval, to: metrics, input: retrieved}
  - {from: dataset_source, to: metrics, input: query_text}
  - {from: asr, to: metrics, input: query_text}
  - {from: dataset_source, to: metrics, input: reference_transcription}
  - {from: dataset_source, to: metrics, input: relevant_docs}
  - {from: query_correction, to: metrics, input: corrected_query_text}
  - {from: transcription_metrics, to: metrics, input: per_query_wer}
  - {from: transcription_metrics, to: metrics, input: per_query_cer}
  - {from: retrieval_metrics, to: metrics, input: per_query_recall5}
  - {from: retrieval, to: build_query_traces, input: retrieved}
  - {from: metrics, to: build_query_traces, input: metrics}
  - {from: dataset_source, to: build_query_traces, input: reference_transcription}
  - {from: dataset_source, to: build_query_traces, input: relevant_docs}
  - {from: transcription_metrics, to: build_query_traces, input: per_query_wer}
  - {from: transcription_metrics, to: build_query_traces, input: per_query_cer}
  - {from: retrieval_metrics, to: build_query_traces, input: per_query_recall5}
  - {from: metrics, to: finalize, input: metrics}
  - {from: build_query_traces, to: finalize, input: query_traces}
  - {from: retrieval, to: finalize, input: retrieved}
nodes:
  asr:
    model: whisper
    name: openai/whisper-base
    device: cuda:0
  text_embedding:
    model: labse
    device: cuda:0
  vector_db:
    store: inmemory
  retrieval:
    k: 10
runtime:
  cache:
    enabled: false
  logging:
    console_level: WARNING
llm:
  model: mistral:7b-instruct
  use_local_server: true
  local_server_url: http://localhost:11434/v1/chat/completions
  api_key_env: DUMMY_KEY
  temperature: 0.0
  seed: 42          # forwarded to the server; temperature 0 alone does not pin sampling
  timeout_s: 120
