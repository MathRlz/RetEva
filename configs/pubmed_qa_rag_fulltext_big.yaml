# Large full-text set: 1209 PubMedQA questions whose article is in PMC open access.
#
# Same pipeline as pubmed_qa_rag_fulltext.yaml, ~10x the questions. Built with:
#   python3 scripts/scan_pubmed_fulltext.py --config pqa_artificial --pool 5000
#   python3 scripts/build_pubmed_campaign.py --config pqa_artificial \
#       --pmids pubmed_fulltext_pqa_artificial.json --full-text -n 1209 \
#       --out examples/data/pubmed_qa_fulltext_big
#
# NOTE ON LABELS: pqa_artificial's final_decision and long_answer are AUTO-DERIVED, not expert
# annotations, and the label mix is essentially yes/no (little or no "maybe"). Check the mix
# before reading mean_decision_accuracy — the majority-class baseline is what it must beat, and
# on this split that baseline is usually higher than on pqa_labeled. The 115-question
# pqa_labeled set stays the credible primary result; this one buys statistical power.
#
# COST: this is a FULL SWEEP — every one of the 1209 questions is retrieved, answered, and
# judged (trace_limit / max_cases all 0; an earlier revision capped trace_limit at 300, which
# silently truncated the RUN itself, since the same knob slices the dataset). Budget most of a
# working day at gemma4 speeds even with concurrency 4: judging dominates (~26 s/case serial).
# Start the server as `OLLAMA_NUM_PARALLEL=4 ollama serve` or the concurrency is wasted, and use
# `nohup`/`tmux` — the run is far longer than an ssh session's patience.
#
experiment:
  name: pubmed_qa_rag_fulltext_big
  output_dir: evaluation_results
dataset:
  id: pubmed_qa
  questions: examples/data/pubmed_qa_fulltext_big/questions.json
  corpus: examples/data/pubmed_qa_fulltext_big/corpus.json
  trace_limit: 0        # 0 = no limit: every question runs and every one is traced
  batch_size: 8         # no ASR in the graph, so batching is embed-bound only
data:
  num_workers: 0
graph:
  nodes:
  - dataset_source
  - corpus_embedding
  - vector_db
  - text_embedding
  - retrieval
  - id: answer_gen
    type: answer_gen
    params:
      method: simple
      # The prompt IS part of the experiment — spelled out here so a change to the code
      # defaults cannot silently alter an already-reported run. These are the built-ins.
      system_prompt: |-
        You are a concise medical research assistant. Answer based ONLY on the provided context. Be brief and direct.
        Reply in exactly this format, nothing before it:
        Short Answer: yes or no or maybe
        Long Answer: <your detailed answer>
      prompt_template: |-
        Context:
        {context}

        Question: {question}

        Short Answer:
      max_cases: 0       # 0 = generate for every query
      context_docs: 3   # how many retrieved docs are pasted into the prompt
      compute_rouge: true
      reference_metadata_field: long_answer   # the doc metadata field holding the answer GT
      # Generation context: `retrieved_text` = the indexed abstract passage (default);
      # `full_text` = the PMC article from metadata.full_text, chunked and filtered to the
      # chunks closest to the question. Run `scripts/fetch_pubmed_fulltext.py` on the corpus
      # first; docs with no full text silently fall back to their abstract passage.
      context_source: full_text
      context_chunk_chars: 1200
      context_chunks: 4
  - retrieval_metrics
  - answer_metrics
  - metrics
  - build_query_traces
  - id: answer_judge
    type: answer_judge
    params:
      system_prompt: |-
        You are an expert evaluator for a medical question-answering retrieval system. Score each requested aspect from 0.0 (worst) to 1.0 (best). Be strict and consistent. Respond with STRICT JSON only — no prose, no markdown.
      max_cases: 0     # 0 = judge EVERY trace (the default is 50 — the silent cap
                       # that judged 50 of 1209 in an earlier run)
  - finalize
  edges:
  - {from: dataset_source, to: corpus_embedding, input: corpus}
  - {from: corpus_embedding, to: vector_db, input: corpus_vectors}
  - {from: dataset_source, output: reference_text, to: text_embedding, input: query_text}
  - {from: text_embedding, output: text_query_vectors, to: retrieval, input: query_vectors}
  - {from: vector_db, to: retrieval, input: vector_index}
  - {from: dataset_source, output: reference_text, to: retrieval, input: query_text}
  - {from: dataset_source, to: retrieval, input: reference_transcription}
  - {from: dataset_source, to: retrieval, input: relevant_docs}
  - {from: dataset_source, output: reference_text, to: answer_gen, input: query_text}
  - {from: retrieval, to: answer_gen, input: retrieved}
  - {from: dataset_source, to: answer_gen, input: short_answers}
  - {from: dataset_source, to: answer_gen, input: relevant_docs}
  - {from: retrieval, to: retrieval_metrics, input: retrieved}
  - {from: dataset_source, to: retrieval_metrics, input: relevant_docs}
  - {from: answer_gen, to: answer_metrics, input: generated_answers}
  - {from: retrieval, to: answer_metrics, input: retrieved}
  - {from: dataset_source, to: answer_metrics, input: relevant_docs}
  - {from: dataset_source, to: answer_metrics, input: short_answers}
  - {from: retrieval_metrics, to: metrics, input: retrieval_scores}
  - {from: answer_metrics, to: metrics, input: answer_scores}
  - {from: retrieval, to: metrics, input: retrieved}
  # no `query_text` edge into metrics: its port is plain (not the OneOf chain), so it cannot
  # take the reference_text route — and with no asr node it would only feed WER diagnostics.
  - {from: dataset_source, to: metrics, input: reference_transcription}
  - {from: dataset_source, to: metrics, input: relevant_docs}
  - {from: retrieval_metrics, to: metrics, input: per_query_recall5}
  - {from: retrieval, to: build_query_traces, input: retrieved}
  - {from: answer_gen, to: build_query_traces, input: generated_answers}
  - {from: metrics, to: build_query_traces, input: metrics}
  - {from: dataset_source, to: build_query_traces, input: reference_transcription}
  - {from: dataset_source, to: build_query_traces, input: relevant_docs}
  - {from: retrieval_metrics, to: build_query_traces, input: per_query_recall5}
  - {from: metrics, to: answer_judge, input: metrics}
  - {from: build_query_traces, to: answer_judge, input: query_traces}
  - {from: answer_gen, to: answer_judge, input: generated_answers}
  - {from: retrieval, to: answer_judge, input: retrieved}
  - {from: dataset_source, to: answer_judge, input: relevant_docs}
  - {from: retrieval_metrics, to: answer_judge, input: per_query_recall5}
  - {from: metrics, to: finalize, input: metrics}
  - {from: build_query_traces, to: finalize, input: query_traces}
  - {from: answer_judge, to: finalize, input: judge_scores}
  - {from: answer_judge, to: finalize, input: judge_pass}
  - {from: answer_gen, to: finalize, input: generated_answers}
  - {from: retrieval, to: finalize, input: retrieved}
  - {from: answer_judge, to: finalize, input: judge_aspect_accuracy}
  - {from: answer_judge, to: finalize, input: judge_aspect_clarity}
  - {from: answer_judge, to: finalize, input: judge_aspect_completeness}
  - {from: answer_judge, to: finalize, input: judge_aspect_correctness}
  - {from: answer_judge, to: finalize, input: judge_aspect_factuality}
  - {from: answer_judge, to: finalize, input: judge_aspect_faithfulness}
  - {from: answer_judge, to: finalize, input: judge_aspect_relevance}
nodes:
  text_embedding:
    model: labse
    device: cuda:0
  vector_db:
    store: inmemory
  retrieval:
    k: 10
llm:
  model: gemma4:latest
  use_local_server: true
  local_server_url: http://localhost:11434/v1/chat/completions
  api_key_env: DUMMY_KEY
  temperature: 0.0
  # 4 requests in flight — ~1.9x on answer generation and judging. The SERVER must
  # allow it: `OLLAMA_NUM_PARALLEL=4 ollama serve`, else requests just queue. Costs
  # bit-reproducibility of the generated text (batching changes the numerics); set 1
  # for a run you intend to quote exactly.
  concurrency: 4
  seed: 42          # forwarded to the server; temperature 0 alone does not pin sampling
  timeout_s: 120
runtime:
  cache:
    enabled: true
    cache_dir: .cache
    cache_embeddings: true
    cache_vector_db: true
  logging:
    console_level: INFO
    file_level: DEBUG
