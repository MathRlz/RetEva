experiment:
  name: production_evaluation
  output_dir: evaluation_results
dataset:
  id: pubmed_qa
  questions: examples/data/pubmed_qa_campaign/questions.json
  corpus: examples/data/pubmed_qa_campaign/corpus.json
  trace_limit: 0
  batch_size: 64
data:
  strict_validation: true
  num_workers: 4
  test_size: 0.0
graph:
  nodes:
  - dataset_source
  - corpus_embedding
  - vector_db
  - asr
  - text_embedding
  - id: retrieval
    type: retrieval
    params:
      mode: dense
  - id: retrieval_sparse
    type: retrieval
    params:
      mode: sparse
  - id: result_fusion
    type: result_fusion
    params:
      hybrid: true
  - rerank
  - transcription_metrics
  - retrieval_metrics
  - metrics
  - finalize
  edges:
  - {from: dataset_source, to: corpus_embedding, input: corpus}
  - {from: corpus_embedding, to: vector_db, input: corpus_vectors}
  - {from: dataset_source, to: asr, input: query_audio}
  - {from: dataset_source, to: asr, input: reference_transcription}
  - {from: dataset_source, to: text_embedding, input: query_text}
  - {from: asr, to: text_embedding, input: query_text}
  - {from: text_embedding, output: text_query_vectors, to: retrieval, input: query_vectors}
  - {from: vector_db, to: retrieval, input: vector_index}
  - {from: dataset_source, to: retrieval, input: query_text}
  - {from: asr, to: retrieval, input: query_text}
  - {from: dataset_source, to: retrieval, input: reference_transcription}
  - {from: dataset_source, to: retrieval, input: relevant_docs}
  - {from: text_embedding, output: text_query_vectors, to: retrieval_sparse, input: query_vectors}
  - {from: vector_db, to: retrieval_sparse, input: vector_index}
  - {from: dataset_source, to: retrieval_sparse, input: query_text}
  - {from: asr, to: retrieval_sparse, input: query_text}
  - {from: dataset_source, to: retrieval_sparse, input: reference_transcription}
  - {from: dataset_source, to: retrieval_sparse, input: relevant_docs}
  - {from: retrieval, to: result_fusion, input: retrieved}
  - {from: retrieval_sparse, to: result_fusion, input: retrieved}
  - {from: retrieval, to: rerank, input: retrieved}
  - {from: retrieval_sparse, to: rerank, input: retrieved}
  - {from: result_fusion, to: rerank, input: retrieved}
  - {from: text_embedding, output: text_query_vectors, to: rerank, input: query_vectors}
  - {from: dataset_source, to: rerank, input: query_text}
  - {from: asr, to: rerank, input: query_text}
  - {from: dataset_source, to: rerank, input: reference_transcription}
  - {from: dataset_source, to: transcription_metrics, input: query_text}
  - {from: asr, to: transcription_metrics, input: query_text}
  - {from: dataset_source, to: transcription_metrics, input: reference_transcription}
  - {from: retrieval, to: retrieval_metrics, input: retrieved}
  - {from: retrieval_sparse, to: retrieval_metrics, input: retrieved}
  - {from: result_fusion, to: retrieval_metrics, input: retrieved}
  - {from: rerank, to: retrieval_metrics, input: retrieved}
  - {from: dataset_source, to: retrieval_metrics, input: relevant_docs}
  - {from: transcription_metrics, to: metrics, input: transcription_scores}
  - {from: retrieval_metrics, to: metrics, input: retrieval_scores}
  - {from: retrieval, to: metrics, input: retrieved}
  - {from: retrieval_sparse, to: metrics, input: retrieved}
  - {from: result_fusion, to: metrics, input: retrieved}
  - {from: rerank, to: metrics, input: retrieved}
  - {from: dataset_source, to: metrics, input: query_text}
  - {from: asr, to: metrics, input: query_text}
  - {from: dataset_source, to: metrics, input: reference_transcription}
  - {from: dataset_source, to: metrics, input: relevant_docs}
  - {from: transcription_metrics, to: metrics, input: per_query_wer}
  - {from: transcription_metrics, to: metrics, input: per_query_cer}
  - {from: retrieval_metrics, to: metrics, input: per_query_recall5}
  - {from: metrics, to: finalize, input: metrics}
  - {from: retrieval, to: finalize, input: retrieved}
  - {from: retrieval_sparse, to: finalize, input: retrieved}
  - {from: result_fusion, to: finalize, input: retrieved}
  - {from: rerank, to: finalize, input: retrieved}
vector_db:
  bm25_k1: 1.5
  bm25_b: 0.75
nodes:
  asr:
    model: whisper
    name: openai/whisper-large-v3
    adapter: null
    device: cuda:0
  text_embedding:
    model: jina_v4
    name: jinaai/jina-embeddings-v4
    adapter: null
    device: cuda:1
  audio_embedding:
    model: null
    name: null
    device: cuda:0
  vector_db:
    store: faiss_gpu
  retrieval:
    gpu_id: 0
    k: 10
    mode: hybrid
    fusion:
      method: rrf
      dense_weight: 0.5
      rrf_k: 60
    reranker:
      mode: cross_encoder
      enabled: true
      top_k: 50
      weight: 0.35
      model: cross-encoder/ms-marco-MiniLM-L-6-v2
      device: cuda:1
runtime:
  cache:
    enabled: true
    cache_dir: .cache
    max_size_gb: null
    cache_asr_features: true
    cache_transcriptions: true
    cache_embeddings: true
    cache_vector_db: true
  logging:
    log_dir: logs
    console_level: INFO
    file_level: DEBUG
checkpoint_enabled: true
checkpoint_interval: 200
resume_from_checkpoint: true
audio_synthesis:
  enabled: false
  provider: mms
  voice: en
  sample_rate: 16000
  seed: 42
  output_dir: data/pubmed_qa/audio
