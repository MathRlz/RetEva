# APM self-retrieval — all 6 models in one flat run (2 encoders × 3 pooling strategies).
#
# One graph: a single dataset_source/corpus_embedding/vector_db feeds six distinctly-named
# audio_embedding variants, each with its own retrieval + metrics chain. No graph.branches —
# the shared nodes (dataset_source, corpus_embedding, vector_db) just have multiple outgoing
# edges, same as any other fan-out in the graph.
experiment:
  name: apm_admed_all_models
  output_dir: evaluation_results

dataset:
  id: admed_voice
  path: ${ADMED_VOICE_PATH}
  split: test
  batch_size: 32

data:
  num_workers: 4
  test_size: 0.3

graph:
  nodes:
  - dataset_source
  - id: corpus_embedding
    type: corpus_embedding
    params:
      model: jina_v4
      name: jinaai/jina-embeddings-v4
      embedding_space: jina_v4_space
      device: cuda:1
  - vector_db
  - id: audio_embedding_whisper_attention
    type: audio_embedding
    params:
      model: attention_pool
      encoder: whisper
      encoder-size: large
      dim: 2048
      embedding_space: jina_v4_space
      params: {pooling: attention}
      model_path: ${APM_CHECKPOINT_DIR}/apm_whisper_jina_admed_voice.pt
      device: cuda:0
  - id: audio_embedding_whisper_whiten
    type: audio_embedding
    params:
      model: attention_pool
      encoder: whisper
      encoder-size: large
      dim: 2048
      embedding_space: jina_v4_space
      params: {pooling: mean_whiten}
      model_path: ${APM_CHECKPOINT_DIR}/apm_whisper_jina_admed_voice_whitened_none.pt
      device: cuda:0
  - id: audio_embedding_whisper_abtt
    type: audio_embedding
    params:
      model: attention_pool
      encoder: whisper
      encoder-size: large
      dim: 2048
      embedding_space: jina_v4_space
      params: {pooling: mean_abtt}
      model_path: ${APM_CHECKPOINT_DIR}/apm_whisper_jina_admed_voice_abtt_none.pt
      device: cuda:0
  - id: audio_embedding_m4t_attention
    type: audio_embedding
    params:
      model: attention_pool
      encoder: m4t
      encoder-size: v2-large
      dim: 2048
      embedding_space: jina_v4_space
      params: {pooling: attention}
      model_path: ${APM_CHECKPOINT_DIR}/apm_m4t_jina_admed_voice_attention_whitening.pt
      device: cuda:0
  - id: audio_embedding_m4t_whiten
    type: audio_embedding
    params:
      model: attention_pool
      encoder: m4t
      encoder-size: v2-large
      dim: 2048
      embedding_space: jina_v4_space
      params: {pooling: mean_whiten}
      model_path: ${APM_CHECKPOINT_DIR}/apm_m4t_jina_admed_voice_whitened_none.pt
      device: cuda:0
  - id: audio_embedding_m4t_abtt
    type: audio_embedding
    params:
      model: attention_pool
      encoder: m4t
      encoder-size: v2-large
      dim: 2048
      embedding_space: jina_v4_space
      params: {pooling: mean_abtt}
      model_path: ${APM_CHECKPOINT_DIR}/apm_m4t_jina_admed_voice_abtt_none.pt
      device: cuda:0
  - id: retrieval_whisper_attention
    type: retrieval
  - id: retrieval_whisper_whiten
    type: retrieval
  - id: retrieval_whisper_abtt
    type: retrieval
  - id: retrieval_m4t_attention
    type: retrieval
  - id: retrieval_m4t_whiten
    type: retrieval
  - id: retrieval_m4t_abtt
    type: retrieval
  - id: retrieval_metrics_whisper_attention
    type: retrieval_metrics
  - id: retrieval_metrics_whisper_whiten
    type: retrieval_metrics
  - id: retrieval_metrics_whisper_abtt
    type: retrieval_metrics
  - id: retrieval_metrics_m4t_attention
    type: retrieval_metrics
  - id: retrieval_metrics_m4t_whiten
    type: retrieval_metrics
  - id: retrieval_metrics_m4t_abtt
    type: retrieval_metrics
  - id: metrics_whisper_attention
    type: metrics
  - id: metrics_whisper_whiten
    type: metrics
  - id: metrics_whisper_abtt
    type: metrics
  - id: metrics_m4t_attention
    type: metrics
  - id: metrics_m4t_whiten
    type: metrics
  - id: metrics_m4t_abtt
    type: metrics
  - id: finalize_whisper_attention
    type: finalize
  - id: finalize_whisper_whiten
    type: finalize
  - id: finalize_whisper_abtt
    type: finalize
  - id: finalize_m4t_attention
    type: finalize
  - id: finalize_m4t_whiten
    type: finalize
  - id: finalize_m4t_abtt
    type: finalize
  edges:
  - {from: dataset_source, to: corpus_embedding, input: corpus}
  - {from: corpus_embedding, to: vector_db, input: corpus_vectors}
  - {from: dataset_source, to: audio_embedding_whisper_attention, input: query_audio}
  - {from: dataset_source, to: audio_embedding_whisper_whiten, input: query_audio}
  - {from: dataset_source, to: audio_embedding_whisper_abtt, input: query_audio}
  - {from: dataset_source, to: audio_embedding_m4t_attention, input: query_audio}
  - {from: dataset_source, to: audio_embedding_m4t_whiten, input: query_audio}
  - {from: dataset_source, to: audio_embedding_m4t_abtt, input: query_audio}

  - {from: audio_embedding_whisper_attention, output: audio_query_vectors, to: retrieval_whisper_attention, input: query_vectors}
  - {from: vector_db, to: retrieval_whisper_attention, input: vector_index}
  - {from: dataset_source, to: retrieval_whisper_attention, input: query_text}
  - {from: dataset_source, to: retrieval_whisper_attention, input: reference_transcription}
  - {from: dataset_source, to: retrieval_whisper_attention, input: relevant_docs}
  - {from: retrieval_whisper_attention, to: retrieval_metrics_whisper_attention, input: retrieved}
  - {from: dataset_source, to: retrieval_metrics_whisper_attention, input: relevant_docs}
  - {from: retrieval_metrics_whisper_attention, to: metrics_whisper_attention, input: retrieval_scores}
  - {from: retrieval_whisper_attention, to: metrics_whisper_attention, input: retrieved}
  - {from: dataset_source, to: metrics_whisper_attention, input: query_text}
  - {from: dataset_source, to: metrics_whisper_attention, input: reference_transcription}
  - {from: dataset_source, to: metrics_whisper_attention, input: relevant_docs}
  - {from: retrieval_metrics_whisper_attention, to: metrics_whisper_attention, input: per_query_recall5}
  - {from: metrics_whisper_attention, to: finalize_whisper_attention, input: metrics}
  - {from: retrieval_whisper_attention, to: finalize_whisper_attention, input: retrieved}

  - {from: audio_embedding_whisper_whiten, output: audio_query_vectors, to: retrieval_whisper_whiten, input: query_vectors}
  - {from: vector_db, to: retrieval_whisper_whiten, input: vector_index}
  - {from: dataset_source, to: retrieval_whisper_whiten, input: query_text}
  - {from: dataset_source, to: retrieval_whisper_whiten, input: reference_transcription}
  - {from: dataset_source, to: retrieval_whisper_whiten, input: relevant_docs}
  - {from: retrieval_whisper_whiten, to: retrieval_metrics_whisper_whiten, input: retrieved}
  - {from: dataset_source, to: retrieval_metrics_whisper_whiten, input: relevant_docs}
  - {from: retrieval_metrics_whisper_whiten, to: metrics_whisper_whiten, input: retrieval_scores}
  - {from: retrieval_whisper_whiten, to: metrics_whisper_whiten, input: retrieved}
  - {from: dataset_source, to: metrics_whisper_whiten, input: query_text}
  - {from: dataset_source, to: metrics_whisper_whiten, input: reference_transcription}
  - {from: dataset_source, to: metrics_whisper_whiten, input: relevant_docs}
  - {from: retrieval_metrics_whisper_whiten, to: metrics_whisper_whiten, input: per_query_recall5}
  - {from: metrics_whisper_whiten, to: finalize_whisper_whiten, input: metrics}
  - {from: retrieval_whisper_whiten, to: finalize_whisper_whiten, input: retrieved}

  - {from: audio_embedding_whisper_abtt, output: audio_query_vectors, to: retrieval_whisper_abtt, input: query_vectors}
  - {from: vector_db, to: retrieval_whisper_abtt, input: vector_index}
  - {from: dataset_source, to: retrieval_whisper_abtt, input: query_text}
  - {from: dataset_source, to: retrieval_whisper_abtt, input: reference_transcription}
  - {from: dataset_source, to: retrieval_whisper_abtt, input: relevant_docs}
  - {from: retrieval_whisper_abtt, to: retrieval_metrics_whisper_abtt, input: retrieved}
  - {from: dataset_source, to: retrieval_metrics_whisper_abtt, input: relevant_docs}
  - {from: retrieval_metrics_whisper_abtt, to: metrics_whisper_abtt, input: retrieval_scores}
  - {from: retrieval_whisper_abtt, to: metrics_whisper_abtt, input: retrieved}
  - {from: dataset_source, to: metrics_whisper_abtt, input: query_text}
  - {from: dataset_source, to: metrics_whisper_abtt, input: reference_transcription}
  - {from: dataset_source, to: metrics_whisper_abtt, input: relevant_docs}
  - {from: retrieval_metrics_whisper_abtt, to: metrics_whisper_abtt, input: per_query_recall5}
  - {from: metrics_whisper_abtt, to: finalize_whisper_abtt, input: metrics}
  - {from: retrieval_whisper_abtt, to: finalize_whisper_abtt, input: retrieved}

  - {from: audio_embedding_m4t_attention, output: audio_query_vectors, to: retrieval_m4t_attention, input: query_vectors}
  - {from: vector_db, to: retrieval_m4t_attention, input: vector_index}
  - {from: dataset_source, to: retrieval_m4t_attention, input: query_text}
  - {from: dataset_source, to: retrieval_m4t_attention, input: reference_transcription}
  - {from: dataset_source, to: retrieval_m4t_attention, input: relevant_docs}
  - {from: retrieval_m4t_attention, to: retrieval_metrics_m4t_attention, input: retrieved}
  - {from: dataset_source, to: retrieval_metrics_m4t_attention, input: relevant_docs}
  - {from: retrieval_metrics_m4t_attention, to: metrics_m4t_attention, input: retrieval_scores}
  - {from: retrieval_m4t_attention, to: metrics_m4t_attention, input: retrieved}
  - {from: dataset_source, to: metrics_m4t_attention, input: query_text}
  - {from: dataset_source, to: metrics_m4t_attention, input: reference_transcription}
  - {from: dataset_source, to: metrics_m4t_attention, input: relevant_docs}
  - {from: retrieval_metrics_m4t_attention, to: metrics_m4t_attention, input: per_query_recall5}
  - {from: metrics_m4t_attention, to: finalize_m4t_attention, input: metrics}
  - {from: retrieval_m4t_attention, to: finalize_m4t_attention, input: retrieved}

  - {from: audio_embedding_m4t_whiten, output: audio_query_vectors, to: retrieval_m4t_whiten, input: query_vectors}
  - {from: vector_db, to: retrieval_m4t_whiten, input: vector_index}
  - {from: dataset_source, to: retrieval_m4t_whiten, input: query_text}
  - {from: dataset_source, to: retrieval_m4t_whiten, input: reference_transcription}
  - {from: dataset_source, to: retrieval_m4t_whiten, input: relevant_docs}
  - {from: retrieval_m4t_whiten, to: retrieval_metrics_m4t_whiten, input: retrieved}
  - {from: dataset_source, to: retrieval_metrics_m4t_whiten, input: relevant_docs}
  - {from: retrieval_metrics_m4t_whiten, to: metrics_m4t_whiten, input: retrieval_scores}
  - {from: retrieval_m4t_whiten, to: metrics_m4t_whiten, input: retrieved}
  - {from: dataset_source, to: metrics_m4t_whiten, input: query_text}
  - {from: dataset_source, to: metrics_m4t_whiten, input: reference_transcription}
  - {from: dataset_source, to: metrics_m4t_whiten, input: relevant_docs}
  - {from: retrieval_metrics_m4t_whiten, to: metrics_m4t_whiten, input: per_query_recall5}
  - {from: metrics_m4t_whiten, to: finalize_m4t_whiten, input: metrics}
  - {from: retrieval_m4t_whiten, to: finalize_m4t_whiten, input: retrieved}

  - {from: audio_embedding_m4t_abtt, output: audio_query_vectors, to: retrieval_m4t_abtt, input: query_vectors}
  - {from: vector_db, to: retrieval_m4t_abtt, input: vector_index}
  - {from: dataset_source, to: retrieval_m4t_abtt, input: query_text}
  - {from: dataset_source, to: retrieval_m4t_abtt, input: reference_transcription}
  - {from: dataset_source, to: retrieval_m4t_abtt, input: relevant_docs}
  - {from: retrieval_m4t_abtt, to: retrieval_metrics_m4t_abtt, input: retrieved}
  - {from: dataset_source, to: retrieval_metrics_m4t_abtt, input: relevant_docs}
  - {from: retrieval_metrics_m4t_abtt, to: metrics_m4t_abtt, input: retrieval_scores}
  - {from: retrieval_m4t_abtt, to: metrics_m4t_abtt, input: retrieved}
  - {from: dataset_source, to: metrics_m4t_abtt, input: query_text}
  - {from: dataset_source, to: metrics_m4t_abtt, input: reference_transcription}
  - {from: dataset_source, to: metrics_m4t_abtt, input: relevant_docs}
  - {from: retrieval_metrics_m4t_abtt, to: metrics_m4t_abtt, input: per_query_recall5}
  - {from: metrics_m4t_abtt, to: finalize_m4t_abtt, input: metrics}
  - {from: retrieval_m4t_abtt, to: finalize_m4t_abtt, input: retrieved}

runtime:
  cache:
    enabled: true
    cache_dir: .cache
    cache_asr_features: false
    cache_transcriptions: false
    cache_embeddings: true
    cache_vector_db: true
  logging:
    console_level: INFO
    file_level: DEBUG
