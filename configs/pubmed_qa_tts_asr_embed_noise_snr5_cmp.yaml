# Full TTS x ASR x text_embedding comparison on pubmed_qa — DISTORTED-AUDIO variant.
#
# VARIANT: white noise @ SNR 5 dB, NO speed perturbation -- SNR-sweep point.
# Part of the ASR-path noise-robustness set around pubmed_qa_tts_asr_embed_noisy_cmp (15 dB white + speed);
# mirrors the pubmed_qa_tts_audioemb_* noise set for the TTS->augment->ASR->text_embedding path.
#
# Same 3x3x2 grid as pubmed_qa_tts_asr_embed_cmp, but every synthesized clip passes
# through an augment_audio node (white noise @ SNR 15 dB + speed perturbation, seeded
# per item, n_variants=1 so query ids stay 1:1 comparable with the clean run) BEFORE
# ASR. Measures robustness of each TTS x ASR x embedding chain to audio degradation.
#
# 3 TTS (xtts_v2, m4t, piper) x 3 ASR (whisper, seamless_m4t, wav2vec2) x 3 text_embedding
# (jina_v4, labse, sonar) = 27 leaf branches, full cartesian product.
#
# Sharing (not duplicated 18x):
#   - corpus_embedding/vector_db: 2 (one per text_embedding model — the corpus only needs
#     re-embedding once per embedding space, independent of tts/asr).
#   - augment_audio: 3 (one per TTS — the same distorted clips feed all of that TTS's ASRs).
#
# Pipeline per leaf: dataset_source.query_text -> tts -> augment_audio -> asr ->
# text_embedding -> retrieval, then auto-appended metrics/finalize chains.
#
# COST: 18 x full retrieval sweep over the dataset, plus 2x corpus embedding, 9x ASR.
# Fill in dataset.questions/dataset.corpus below before running.
experiment:
  name: pubmed_qa_tts_asr_embed_noise_snr5_cmp
  output_dir: evaluation_results

# PUBMED_QA_DATASET -- dir with questions.json + corpus.json (export before running).
dataset:
  id: pubmed_qa
  questions: ${PUBMED_QA_DATASET}/questions.json
  corpus: ${PUBMED_QA_DATASET}/corpus.json
  trace_limit: 0
  batch_size: 8

data:
  num_workers: 0

graph:
  nodes:
  - dataset_source
  - id: tts_xtts
    type: tts
    params:
      provider: xtts_v2
      language: en
      sample_rate: 16000
      seed: 42
      output_dir: evaluation_results/pubmed_qa_tts_asr_embed_noise_snr5_cmp/xtts/audio
      device: "cuda:0"

  - id: tts_m4t
    type: tts
    params:
      provider: m4t
      language: en
      sample_rate: 16000
      seed: 42
      output_dir: evaluation_results/pubmed_qa_tts_asr_embed_noise_snr5_cmp/m4t/audio
      device: "cuda:0"

  - id: tts_piper
    type: tts
    params:
      provider: piper
      voice: en_US-lessac-medium
      sample_rate: 16000
      seed: 42
      output_dir: evaluation_results/pubmed_qa_tts_asr_embed_noise_snr5_cmp/piper/audio

  - id: augment_xtts
    type: augment_audio
    params:
      add_noise: True
      noise_type: white
      snr_db: 5.0
      speed_perturbation: False
      n_variants: 1

  - id: augment_m4t
    type: augment_audio
    params:
      add_noise: True
      noise_type: white
      snr_db: 5.0
      speed_perturbation: False
      n_variants: 1

  - id: augment_piper
    type: augment_audio
    params:
      add_noise: True
      noise_type: white
      snr_db: 5.0
      speed_perturbation: False
      n_variants: 1

  - id: corpus_embedding_jina
    type: corpus_embedding
    params:
      model: jina_v4
      name: jinaai/jina-embeddings-v4
      device: "cuda:1"

  - id: vector_db_jina
    type: vector_db
    params:
      store: inmemory

  - id: corpus_embedding_labse
    type: corpus_embedding
    params:
