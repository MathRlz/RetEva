# Full TTS x ASR x text_embedding comparison on pubmed_qa (retrieval-only, no generation).
#
# MIXED variant: questions in POLISH (${PUBMED_QA_DATASET_PL}), corpus in ENGLISH
# (${PUBMED_QA_DATASET}) — measures CROSS-LINGUAL retrieval (pl query -> en docs).
# Query-side models run Polish; corpus-side stays English (sonar corpus: eng_Latn default).
#
# 3 TTS (xtts_v2, m4t, piper) x 3 ASR (whisper, seamless_m4t, wav2vec2) x 3 text_embedding (+ a 4th ASR arm: whisper large-v2 with the admed LoRA adapter
# from ${ADMED_WHISPER_LORA_PATH} — export it before running)
# (jina_v4, labse, sonar) = 27 leaf branches, full cartesian product. `sonar` needs
# `pip install 'evaluator[sonar]'` (sonar-space + fairseq2) on the run machine.
#
# Only the MEANINGFUL nodes are written here: dataset_source, tts, corpus_embedding,
# vector_db, asr, text_embedding, retrieval. retrieval_metrics/transcription_metrics/
# metrics/finalize are STRUCTURAL and get appended automatically per retrieval node
# (complete_structural_plumbing, one full private chain per variant root — R5/
# multi-variant) — do not add them by hand here, that produces dangling duplicate nodes
# the auto-deriver doesn't recognize as already satisfied.
#
# Sharing (not duplicated 18x):
#   - corpus_embedding/vector_db: 2 (one per text_embedding model — the corpus only needs
#     re-embedding once per embedding space, independent of tts/asr).
#   - transcription_metrics is NOT shared here (auto-plumbing gives each of the 18
#     retrieval variants its own private chain, so ASR-quality WER/CER gets recomputed
#     once per leaf instead of once per tts x asr pair — 18x instead of 9x. Cheap relative
#     to TTS/ASR/embedding cost; a hand-shared version was tried and produces orphaned
#     duplicate nodes instead of savings, see above).
#
# Pipeline per leaf: dataset_source.query_text -> tts -> asr -> text_embedding -> retrieval,
# then the auto-appended retrieval_metrics/transcription_metrics -> metrics -> finalize.
# No answer_gen/answer_judge/query_refine (no generation).
#
# TTS on GPU: xtts_v2/m4t run on `device: cuda:0` (real .to(device) support added to those
# providers — see TODO.md); piper is a CPU-only external binary, no device param.
#
# COST: 18 x full retrieval + transcription-metrics sweep over the dataset, plus 2x corpus
# embedding, 9x ASR, 3x TTS. Verified: builds to 125 nodes (53 meaningful + 18x4 auto
# structural), zero embedding-space mismatches, zero dangling/orphaned nodes, every
# model-type/size/name resolves cleanly (validate_models + per-node factory dry-check).
# Fill in dataset.questions/dataset.corpus below before running.
experiment:
  name: pubmed_qa_tts_asr_embed_cmp_plen
  output_dir: evaluation_results

# PUBMED_QA_DATASET_PL -- dir with POLISH questions.json + corpus.json;
# PUBMED_QA_DATASET -- dir with the ENGLISH corpus.json (export both before running).
dataset:
  id: pubmed_qa
  questions: ${PUBMED_QA_DATASET_PL}/questions.json
  corpus: ${PUBMED_QA_DATASET}/corpus.json
  trace_limit: 0
  batch_size: 8

data:
  num_workers: 0

graph:
  nodes:
  - dataset_source
  - id: tts_xtts
    type: tts
    params:
      provider: xtts_v2
      language: pl
      sample_rate: 16000
      seed: 42
      output_dir: evaluation_results/pubmed_qa_tts_asr_embed_cmp_plen/xtts/audio
      device: "cuda:0"

  - id: tts_m4t
    type: tts
    params:
      provider: m4t
      language: pl
      sample_rate: 16000
      seed: 42
      output_dir: evaluation_results/pubmed_qa_tts_asr_embed_cmp_plen/m4t/audio
      device: "cuda:0"

  - id: tts_piper
    type: tts
    params:
      provider: piper
      voice: pl_PL-gosia-medium
      sample_rate: 16000
      seed: 42
      output_dir: evaluation_results/pubmed_qa_tts_asr_embed_cmp_plen/piper/audio

  - id: corpus_embedding_jina
    type: corpus_embedding
    params:
      model: jina_v4
      name: jinaai/jina-embeddings-v4
      device: "cuda:1"

  - id: vector_db_jina
    type: vector_db
    params:
      store: inmemory

  - id: corpus_embedding_labse
