# TTS x audio-embedding comparison on pubmed_qa — DISTORTED-AUDIO variant.
#
# Same 3x3 grid as pubmed_qa_tts_audioemb_cmp, but every synthesized clip passes through
# an augment_audio node (white noise @ SNR 15 dB, NO speed perturbation -- noise-only ablation of noisy_cmp + SNR-sweep point;
# seeded per item, n_variants=1 so query ids stay 1:1 comparable with the clean and
# noisy runs) BEFORE the audio embedder. Part of the noise-robustness experiment set
# around pubmed_qa_tts_audioemb_noisy_cmp (15 dB white + speed).
#
# Pipeline per leaf: dataset_source.query_text -> tts -> audio_embedding -> retrieval.
# The query never goes back through text: the synthesized audio is embedded DIRECTLY by a
# cross-modal audio embedder into the SAME space the corpus was embedded in by the paired
# TEXT embedder:
#
#   apm_whisper: attention_pool (whisper-large encoder + APM attention-pool head,
#        jina-aligned checkpoint, dim 2048) <-> corpus_embedding jina_v4 (jina_v4_space).
#   apm_m4t: attention_pool (SeamlessM4T-v2 encoder + APM head, jina-aligned
#        attention+whitening checkpoint) -- SAME jina_v4_space, so it retrieves against
#        the SAME shared jina corpus/vector_db as apm_whisper (embedded once).
#   eam: eam_alignment audio side <-> eam_alignment TEXT side embedding the corpus --
#        one side/eam AlignmentModel checkpoint, SAME model_path on both nodes so the
#        loaded core is shared (see models/a2e/eam_alignment.py), shared eam_space.
#
# 3 TTS (xtts_v2, m4t, piper) x 3 pairs = 9 retrieval variants. Only MEANINGFUL nodes are
# written here; retrieval_metrics/metrics/finalize are auto-appended per retrieval variant
# (complete_structural_plumbing) -- do not add them by hand.
#
# Env vars (export before running):
#   PUBMED_QA_DATASET -- dir with questions.json + corpus.json
#   APM_CHECKPOINT_DIR -- dir with apm_whisper_jina_admed_voice.pt (jina-space APM)
#   EAM_CHECKPOINT_DIR -- dir with eam_alignment.pt (side/eam AlignmentModel state_dict)
#                         + model.json (the run's AlignmentModelConfig; supplies num_heads,
#                         cross-checks input_dim/embedding_dim against the checkpoint)
#
# TTS on GPU: xtts_v2/m4t on cuda:0; piper is a CPU-only external binary.
experiment:
  name: pubmed_qa_tts_audioemb_noise_snr15_cmp
  output_dir: evaluation_results

dataset:
  id: pubmed_qa
  questions: ${PUBMED_QA_DATASET}/questions.json
  corpus: ${PUBMED_QA_DATASET}/corpus.json
  trace_limit: 0
  batch_size: 8

data:
  num_workers: 0

graph:
  nodes:
  - dataset_source
  - id: tts_xtts
    type: tts
    params:
      provider: xtts_v2
      language: en
      sample_rate: 16000
      seed: 42
      output_dir: evaluation_results/pubmed_qa_tts_audioemb_noise_snr15_cmp/xtts/audio
      device: "cuda:0"
  - id: tts_m4t
    type: tts
    params:
      provider: m4t
      language: en
      sample_rate: 16000
      seed: 42
      output_dir: evaluation_results/pubmed_qa_tts_audioemb_noise_snr15_cmp/m4t/audio
      device: "cuda:0"
  - id: tts_piper
    type: tts
    params:
      provider: piper
      voice: en_US-lessac-medium
      sample_rate: 16000
      seed: 42
      output_dir: evaluation_results/pubmed_qa_tts_audioemb_noise_snr15_cmp/piper/audio
  - id: augment_xtts
    type: augment_audio
    params:
      add_noise: True
      noise_type: white
      snr_db: 15.0
      speed_perturbation: False
      n_variants: 1
  - id: augment_m4t
    type: augment_audio
    params:
      add_noise: True
      noise_type: white
      snr_db: 15.0
      speed_perturbation: False
      n_variants: 1
  - id: augment_piper
    type: augment_audio
    params:
      add_noise: True
      noise_type: white
      snr_db: 15.0
      speed_perturbation: False
      n_variants: 1
  - id: corpus_embedding_apm_whisper
    type: corpus_embedding
    params:
      model: jina_v4
      name: jinaai/jina-embeddings-v4
      embedding_space: jina_v4_space
      device: "cuda:1"
  - id: vector_db_apm_whisper
    type: vector_db
    params:
      store: inmemory
  - id: corpus_embedding_eam
    type: corpus_embedding
    params:
      model: eam_alignment
      size: v2-large
      model_path: "${EAM_CHECKPOINT_DIR}/eam_alignment.pt"
      config_path: "${EAM_CHECKPOINT_DIR}/model.json"
      embedding_space: eam_space
      device: "cuda:1"
  - id: vector_db_eam
    type: vector_db
    params:
      store: inmemory
  - id: audio_embedding_xtts_apm_whisper
    type: audio_embedding
    params:
      model: attention_pool
      encoder: whisper
      encoder-size: large
      dim: 2048
      embedding_space: jina_v4_space
      params: {pooling: attention}
      model_path: "${APM_CHECKPOINT_DIR}/apm_whisper_jina_admed_voice.pt"
      device: "cuda:0"
  - id: retrieval_xtts_apm_whisper
    type: retrieval
  - id: audio_embedding_xtts_apm_m4t
    type: audio_embedding
    params:
      model: attention_pool
      encoder: m4t
      encoder-size: v2-large
      dim: 2048
      embedding_space: jina_v4_space
      params: {pooling: attention}
      model_path: "${APM_CHECKPOINT_DIR}/apm_m4t_jina_admed_voice_attention_whitening.pt"
      device: "cuda:0"
  - id: retrieval_xtts_apm_m4t
    type: retrieval
  - id: audio_embedding_xtts_eam
    type: audio_embedding
    params:
      model: eam_alignment
      size: v2-large
      model_path: "${EAM_CHECKPOINT_DIR}/eam_alignment.pt"
      config_path: "${EAM_CHECKPOINT_DIR}/model.json"
      embedding_space: eam_space
      device: "cuda:0"
  - id: retrieval_xtts_eam
    type: retrieval
  - id: audio_embedding_m4t_apm_whisper
    type: audio_embedding
    params:
      model: attention_pool
      encoder: whisper
      encoder-size: large
      dim: 2048
      embedding_space: jina_v4_space
      params: {pooling: attention}
      model_path: "${APM_CHECKPOINT_DIR}/apm_whisper_jina_admed_voice.pt"
      device: "cuda:0"
  - id: retrieval_m4t_apm_whisper
    type: retrieval
  - id: audio_embedding_m4t_apm_m4t
    type: audio_embedding
    params:
      model: attention_pool
      encoder: m4t
      encoder-size: v2-large
      dim: 2048
      embedding_space: jina_v4_space
      params: {pooling: attention}
      model_path: "${APM_CHECKPOINT_DIR}/apm_m4t_jina_admed_voice_attention_whitening.pt"
      device: "cuda:0"
  - id: retrieval_m4t_apm_m4t
    type: retrieval
  - id: audio_embedding_m4t_eam
    type: audio_embedding
    params:
      model: eam_alignment
      size: v2-large
      model_path: "${EAM_CHECKPOINT_DIR}/eam_alignment.pt"
      config_path: "${EAM_CHECKPOINT_DIR}/model.json"
      embedding_space: eam_space
      device: "cuda:0"
  - id: retrieval_m4t_eam
    type: retrieval
  - id: audio_embedding_piper_apm_whisper
    type: audio_embedding
    params:
      model: attention_pool
      encoder: whisper
      encoder-size: large
      dim: 2048
      embedding_space: jina_v4_space
      params: {pooling: attention}
      model_path: "${APM_CHECKPOINT_DIR}/apm_whisper_jina_admed_voice.pt"
      device: "cuda:0"
  - id: retrieval_piper_apm_whisper
    type: retrieval
  - id: audio_embedding_piper_apm_m4t
    type: audio_embedding
    params:
      model: attention_pool
      encoder: m4t
      encoder-size: v2-large
      dim: 2048
      embedding_space: jina_v4_space
      params: {pooling: attention}
      model_path: "${APM_CHECKPOINT_DIR}/apm_m4t_jina_admed_voice_attention_whitening.pt"
      device: "cuda:0"
  - id: retrieval_piper_apm_m4t
    type: retrieval
  - id: audio_embedding_piper_eam
    type: audio_embedding
    params:
      model: eam_alignment
      size: v2-large
      model_path: "${EAM_CHECKPOINT_DIR}/eam_alignment.pt"
      config_path: "${EAM_CHECKPOINT_DIR}/model.json"
      embedding_space: eam_space
      device: "cuda:0"
  - id: retrieval_piper_eam
    type: retrieval

  edges:
  - {from: dataset_source, to: tts_xtts, input: query_text}
  - {from: dataset_source, to: tts_m4t, input: query_text}
  - {from: dataset_source, to: tts_piper, input: query_text}
  - {from: tts_xtts, to: augment_xtts, input: query_audio}
  - {from: tts_m4t, to: augment_m4t, input: query_audio}
  - {from: tts_piper, to: augment_piper, input: query_audio}
  - {from: dataset_source, to: corpus_embedding_apm_whisper, input: corpus}
  - {from: corpus_embedding_apm_whisper, to: vector_db_apm_whisper, input: corpus_vectors}
  - {from: dataset_source, to: corpus_embedding_eam, input: corpus}
  - {from: corpus_embedding_eam, to: vector_db_eam, input: corpus_vectors}
  - {from: augment_xtts, to: audio_embedding_xtts_apm_whisper, input: query_audio}
  - {from: audio_embedding_xtts_apm_whisper, output: audio_query_vectors, to: retrieval_xtts_apm_whisper, input: query_vectors}
  - {from: vector_db_apm_whisper, to: retrieval_xtts_apm_whisper, input: vector_index}
  - {from: dataset_source, output: reference_text, to: retrieval_xtts_apm_whisper, input: query_text}
  - {from: dataset_source, to: retrieval_xtts_apm_whisper, input: reference_transcription}
  - {from: dataset_source, to: retrieval_xtts_apm_whisper, input: relevant_docs}
  - {from: augment_xtts, to: audio_embedding_xtts_apm_m4t, input: query_audio}
  - {from: audio_embedding_xtts_apm_m4t, output: audio_query_vectors, to: retrieval_xtts_apm_m4t, input: query_vectors}
  - {from: vector_db_apm_whisper, to: retrieval_xtts_apm_m4t, input: vector_index}
  - {from: dataset_source, output: reference_text, to: retrieval_xtts_apm_m4t, input: query_text}
  - {from: dataset_source, to: retrieval_xtts_apm_m4t, input: reference_transcription}
  - {from: dataset_source, to: retrieval_xtts_apm_m4t, input: relevant_docs}
  - {from: augment_xtts, to: audio_embedding_xtts_eam, input: query_audio}
  - {from: audio_embedding_xtts_eam, output: audio_query_vectors, to: retrieval_xtts_eam, input: query_vectors}
  - {from: vector_db_eam, to: retrieval_xtts_eam, input: vector_index}
  - {from: dataset_source, output: reference_text, to: retrieval_xtts_eam, input: query_text}
  - {from: dataset_source, to: retrieval_xtts_eam, input: reference_transcription}
  - {from: dataset_source, to: retrieval_xtts_eam, input: relevant_docs}
  - {from: augment_m4t, to: audio_embedding_m4t_apm_whisper, input: query_audio}
  - {from: audio_embedding_m4t_apm_whisper, output: audio_query_vectors, to: retrieval_m4t_apm_whisper, input: query_vectors}
  - {from: vector_db_apm_whisper, to: retrieval_m4t_apm_whisper, input: vector_index}
  - {from: dataset_source, output: reference_text, to: retrieval_m4t_apm_whisper, input: query_text}
  - {from: dataset_source, to: retrieval_m4t_apm_whisper, input: reference_transcription}
  - {from: dataset_source, to: retrieval_m4t_apm_whisper, input: relevant_docs}
  - {from: augment_m4t, to: audio_embedding_m4t_apm_m4t, input: query_audio}
  - {from: audio_embedding_m4t_apm_m4t, output: audio_query_vectors, to: retrieval_m4t_apm_m4t, input: query_vectors}
  - {from: vector_db_apm_whisper, to: retrieval_m4t_apm_m4t, input: vector_index}
  - {from: dataset_source, output: reference_text, to: retrieval_m4t_apm_m4t, input: query_text}
  - {from: dataset_source, to: retrieval_m4t_apm_m4t, input: reference_transcription}
  - {from: dataset_source, to: retrieval_m4t_apm_m4t, input: relevant_docs}
  - {from: augment_m4t, to: audio_embedding_m4t_eam, input: query_audio}
  - {from: audio_embedding_m4t_eam, output: audio_query_vectors, to: retrieval_m4t_eam, input: query_vectors}
  - {from: vector_db_eam, to: retrieval_m4t_eam, input: vector_index}
  - {from: dataset_source, output: reference_text, to: retrieval_m4t_eam, input: query_text}
  - {from: dataset_source, to: retrieval_m4t_eam, input: reference_transcription}
  - {from: dataset_source, to: retrieval_m4t_eam, input: relevant_docs}
  - {from: augment_piper, to: audio_embedding_piper_apm_whisper, input: query_audio}
  - {from: audio_embedding_piper_apm_whisper, output: audio_query_vectors, to: retrieval_piper_apm_whisper, input: query_vectors}
  - {from: vector_db_apm_whisper, to: retrieval_piper_apm_whisper, input: vector_index}
  - {from: dataset_source, output: reference_text, to: retrieval_piper_apm_whisper, input: query_text}
  - {from: dataset_source, to: retrieval_piper_apm_whisper, input: reference_transcription}
  - {from: dataset_source, to: retrieval_piper_apm_whisper, input: relevant_docs}
  - {from: augment_piper, to: audio_embedding_piper_apm_m4t, input: query_audio}
  - {from: audio_embedding_piper_apm_m4t, output: audio_query_vectors, to: retrieval_piper_apm_m4t, input: query_vectors}
  - {from: vector_db_apm_whisper, to: retrieval_piper_apm_m4t, input: vector_index}
  - {from: dataset_source, output: reference_text, to: retrieval_piper_apm_m4t, input: query_text}
  - {from: dataset_source, to: retrieval_piper_apm_m4t, input: reference_transcription}
  - {from: dataset_source, to: retrieval_piper_apm_m4t, input: relevant_docs}
  - {from: augment_piper, to: audio_embedding_piper_eam, input: query_audio}
  - {from: audio_embedding_piper_eam, output: audio_query_vectors, to: retrieval_piper_eam, input: query_vectors}
  - {from: vector_db_eam, to: retrieval_piper_eam, input: vector_index}
  - {from: dataset_source, output: reference_text, to: retrieval_piper_eam, input: query_text}
  - {from: dataset_source, to: retrieval_piper_eam, input: reference_transcription}
  - {from: dataset_source, to: retrieval_piper_eam, input: relevant_docs}

# Model lifecycle: lazy load, park models warm in host RAM after last use (fast
# CPU->GPU reuse across the many branches), memory-aware GPU placement with LRU
# eviction instead of OOM. Per-node `device:` params become hints under device_pool.
service_runtime:
  startup_mode: lazy
  offload_policy: on_finish_soft_cpu
  soft_offload_max_warm: 3

device_pool:
  available_devices: ["auto"]
  memory_buffer_percent: 0.1
  allow_gpu_eviction: true
  allow_cpu_fallback: true

runtime:
  cache:
    enabled: true
    cache_dir: .cache
    cache_asr_features: true
    cache_transcriptions: true
    cache_embeddings: true
    cache_vector_db: true
  logging:
    console_level: INFO
    file_level: DEBUG
