[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evaluator"
version = "0.2.0"
description = "Evaluation framework for medical speech retrieval"
authors = [{ name = "Krystian" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    # Core ML
    "torch>=2.0,<3",
    # datasets/core.py imports this unconditionally — it's a hard runtime dependency, not
    # just something that happens to already be present alongside torch in most envs.
    "torchaudio>=2.0,<3",
    "transformers>=4.30,<5",
    "sentencepiece>=0.1.99",
    "sentence-transformers>=2.2,<4",
    "faiss-cpu>=1.7,<2",
    "faster-whisper>=0.9,<2",
    # Data & metrics
    "datasets>=2.14",
    "jiwer>=3.0",
    "numpy>=1.24",
    "scipy>=1.9",
    "scikit-learn>=1.2",
    "rouge-score>=0.1",
    "pandas>=1.5",
    # Visualization
    "matplotlib>=3.5",
    # Utilities
    "tqdm>=4.64",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
webapi = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "jinja2>=3.1",
    "python-multipart>=0.0.6",
]
notebooks = ["jupyter", "notebook", "ipywidgets"]
chromadb = ["chromadb>=0.4"]
qdrant = ["qdrant-client>=1.6"]
backends = ["chromadb>=0.4", "qdrant-client>=1.6"]
# fairseq2n==0.8.1 hard-pins torch==2.9.1 (its first release to pin torch at all) — an
# unconstrained `sonar-space` install resolves fairseq2/fairseq2n to the newest release,
# force-upgrading torch out from under whatever this env already has and breaking any
# ABI-sensitive torch extension (torchaudio, torchvision, ...) built against the old
# version — observed in practice: "undefined symbol: torch_library_impl" from torchaudio
# after `pip install evaluator[sonar]` silently bumped torch 2.6.0+cu124 -> 2.9.1. Pin
# below the first pinning release so this extra installs alongside whatever torch is
# already here instead of hijacking it. Bump this cap only after checking the new
# fairseq2n release's own torch pin won't repeat this.
sonar = ["sonar-space", "fairseq2n<0.8.1", "fairseq2<0.8.1"]
dev = ["pytest", "pytest-cov", "black", "flake8", "mypy", "pytrec-eval-terrier"]
all = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "jupyter",
    "notebook",
    "ipywidgets",
    "chromadb>=0.4",
    "qdrant-client>=1.6",
    "fairseq2n<0.8.1",
    "fairseq2<0.8.1",
    "sonar-space",
]

[project.scripts]
evaluator = "evaluator.cli.main:main"
evaluator-webapi = "evaluator.webapi.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 100

[tool.setuptools.packages.find]
include = ["evaluator*"]

# Ship the server-rendered UI assets with the package — without these the
# installed `evaluator-webapi` crashes on the missing static/templates dirs.
[tool.setuptools.package-data]
"evaluator.webapi" = ["static/*", "templates/*"]
